<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>skill.AI · prova B · per tempo</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#f1f5f9;--mut:#94a3b8;--acc:#38bdf8;
--s-todo:#38bdf8;--s-tried:#fbbf24;--s-inst:#4ade80;--s-drop:#f87171;--nota:#a5b4fc}
@media (prefers-color-scheme:light){:root{--bg:#f1f5f9;--card:#fff;--line:#e2e8f0;--txt:#0f172a;--mut:#64748b;--nota:#4f46e5}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,sans-serif;padding-bottom:96px}

/* ---- barra in alto: si ritira quando scorri ---- */
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 14px;
  display:flex;align-items:center;gap:8px;min-height:52px;border-bottom:1px solid var(--line)}
.marchio{font-size:19px;font-weight:700;letter-spacing:-.01em;flex:1}
.tondo{width:44px;height:44px;flex:none;border:0;background:none;color:var(--mut);display:grid;place-items:center;border-radius:12px}
.tondo:active{background:var(--card)}

/* ---- filtri (solo versione B): vanno a capo, non si tagliano ---- */
.filtri{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.filtri button{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:999px;
  padding:0 13px;height:44px;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.filtri button.on{background:var(--acc);color:#0f172a;border-color:var(--acc);font-weight:600}
.pallino{width:9px;height:9px;border-radius:50%;flex:none}

/* ---- titolo di gruppo ---- */
.gruppo{display:flex;align-items:center;gap:9px;padding:18px 14px 7px;font-size:13px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.gruppo .pallino{width:10px;height:10px}
.gruppo b{margin-left:auto;font-weight:700;color:var(--mut);letter-spacing:0;text-transform:none;font-size:14px}

/* ---- la riga ---- */
.riga{display:flex;gap:11px;padding:11px 14px 11px 0;background:var(--card);border-bottom:1px solid var(--line);
  align-items:flex-start;position:relative}
.riga:first-of-type{border-top:1px solid var(--line)}
.riga:active{background:var(--bg)}
.filo{width:4px;flex:none;align-self:stretch;border-radius:0 4px 4px 0;margin-right:7px}
.tipo{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:rgba(148,163,184,.14);color:var(--mut);margin-top:1px}
.tipo svg{width:19px;height:19px;display:block}
.corpo{flex:1;min-width:0}
.tit{font-size:16px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{margin-top:3px;font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta .stato{color:var(--txt);font-weight:600}
.nota{margin-top:5px;font-size:13.5px;color:var(--nota);display:flex;gap:6px;align-items:flex-start;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.vuoto{text-align:center;color:var(--mut);padding:44px 18px;font-size:15px}
.apri-scartate{margin:16px 14px 0;width:calc(100% - 28px);height:44px;border:1px dashed var(--line);
  background:none;color:var(--mut);border-radius:12px;font-size:14px}

.nota-prova{margin:26px 14px calc(20px + env(safe-area-inset-bottom));padding:14px 16px;border:1px dashed var(--line);
  border-radius:14px;display:grid;gap:7px;color:var(--mut);font-size:13.5px;line-height:1.45}
.nota-prova strong{color:var(--txt);font-size:14px}
.nota-prova a{color:var(--acc);font-weight:600;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:60px;height:60px;
  border-radius:50%;border:0;background:var(--acc);color:#0f172a;font-size:32px;box-shadow:0 6px 18px #0007}
</style>
</head>
<body>
<header>
  <span class="marchio">skill.AI</span>
  <button class="tondo" aria-label="Cerca"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg></button>
</header>
<div class="filtri" id="filtri" hidden></div>
<main id="lista"></main>
<button id="fab" aria-label="Aggiungi link">+</button>

<footer class="nota-prova">
  <strong>Prova: versione B · per tempo</strong>
  <span>Dieci link finti, solo per guardare la grafica. Non è l'app vera e non salva niente.</span>
  <a href="skill-a.html">Guarda la versione A · per stato</a>
</footer>

<script type="module">
const V = "b";  // questa pagina e' la versione B · per tempo
const now = Date.now(), g = d => now - d*86400000;
const DATI = [
 {url:"https://github.com/anthropics/claude-code",title:"anthropics/claude-code",description:"Strumento da terminale che capisce il tuo progetto.",status:"inst",notes:"Installato sul fisso, provare anche sul portatile",createdAt:g(2)},
 {url:"https://www.instagram.com/reel/C8xYz",title:"matteo.ai · Tre prompt che uso ogni giorno per scrivere meglio",description:"Il primo riscrive una mail in tono gentile, il secondo riassume un PDF lungo.",status:"todo",notes:"",createdAt:g(1)},
 {url:"https://www.tiktok.com/@dev/video/7399",title:"Fai un sito in 5 minuti con v0",description:"Scrivi cosa vuoi e genera i componenti già pronti.",status:"tried",notes:"Carino ma il codice che esce va rifatto",createdAt:g(5)},
 {url:"https://huggingface.co/spaces/stabilityai/stable-diffusion",title:"Stable Diffusion — spazio di prova",description:"Prova il modello dal browser, senza installare niente.",status:"drop",notes:"Troppo lento la sera",createdAt:g(9)},
 {url:"https://docs.anthropic.com/skills",title:"Come si scrive una skill",description:"Guida ufficiale: cartella, SKILL.md, descrizione.",status:"todo",notes:"",createdAt:g(3)},
 {url:"https://www.youtube.com/watch?v=abc",title:"Ollama: modelli in locale sul portatile",description:"Installazione, scelta del modello e quanta memoria serve.",status:"todo",notes:"",createdAt:g(14)},
 {url:"https://github.com/openai/whisper",title:"openai/whisper",description:"Trascrive audio in testo in tante lingue.",status:"tried",notes:"Funziona bene sulle registrazioni del bar",createdAt:g(20)},
 {url:"https://www.instagram.com/reel/D1aBc",title:"sara.codes · Agenti che si parlano fra loro",description:"Cosa cambia quando due modelli si passano il lavoro.",status:"todo",notes:"",createdAt:g(25)},
 {url:"https://github.com/ggerganov/llama.cpp",title:"ggerganov/llama.cpp",description:"Far girare i modelli sulla CPU di casa.",status:"todo",notes:"",createdAt:g(4)},
 {url:"https://www.youtube.com/watch?v=xyz",title:"Dieci skill che vale la pena installare subito",description:"Rassegna veloce, una per minuto.",status:"todo",notes:"",createdAt:g(6)}
];
const STATI = {todo:"Da vedere", tried:"Provata", inst:"Installata", drop:"Scartata"};
const PLUR  = {todo:"Da vedere", tried:"Provate", inst:"Installate", drop:"Scartate"};
const ORDINE = ["todo","tried","inst","drop"];

/* il tipo si capisce dal dominio: video, repo o guida */
const dominio = u => { try{ return new URL(u).hostname.replace(/^www\./,""); }catch{ return u; } };
function tipo(u){
  const d = dominio(u);
  if (/instagram|tiktok|youtube|youtu\.be|facebook|threads/.test(d)) return "video";
  if (/github|gitlab|huggingface/.test(d)) return "repo";
  return "guida";
}
const SEGNI = {
  video:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="3.5"/><path d="M10 9.3l5 2.7-5 2.7z" fill="currentColor" stroke="none"/></svg>',
  repo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 8L5 12l3.5 4M15.5 8L19 12l-3.5 4"/></svg>',
  guida:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 3.5h9l5 5v12h-14z"/><path d="M14 3.5v5h5M8.5 13h7M8.5 16.5h5"/></svg>'
};
const quando = t => {
  const d = Math.floor((now - t)/86400000);
  if (d <= 0) return "oggi"; if (d === 1) return "ieri";
  if (d < 7) return d + " giorni";
  if (d < 30){ const n = Math.round(d/7); return n === 1 ? "1 settimana" : n + " settimane"; }
  const m = Math.round(d/30); return m === 1 ? "1 mese" : m + " mesi";
};
const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function riga(i, conStato){
  return `<article class="riga">
    <span class="filo" style="background:var(--s-${i.status})"></span>
    <span class="tipo" aria-hidden="true">${SEGNI[tipo(i.url)]}</span>
    <div class="corpo">
      <div class="tit">${esc(i.title)}</div>
      <div class="meta">${conStato ? `<span class="stato">${STATI[i.status]}</span><span>·</span>` : ""}${esc(dominio(i.url))}<span>·</span>${quando(i.createdAt)}</div>
      ${i.notes ? `<div class="nota">${esc(i.notes)}</div>` : ""}
    </div>
  </article>`;
}

const lista = document.getElementById("lista");

if (V === "a"){
  /* ---- A: raccolte per stato, le scartate riposte ---- */
  let h = "";
  for (const s of ORDINE){
    const g = DATI.filter(i => i.status === s).sort((x,y) => y.createdAt - x.createdAt);
    if (!g.length) continue;
    if (s === "drop"){
      h += `<button class="apri-scartate" id="mostraScartate">Scartate (${g.length})</button>
            <div id="scartate" hidden>` +
           `<h2 class="gruppo"><span class="pallino" style="background:var(--s-drop)"></span>${PLUR[s]}<b>${g.length}</b></h2>` +
           g.map(i => riga(i, false)).join("") + `</div>`;
      continue;
    }
    h += `<h2 class="gruppo"><span class="pallino" style="background:var(--s-${s})"></span>${PLUR[s]}<b>${g.length}</b></h2>`;
    h += g.map(i => riga(i, false)).join("");
  }
  lista.innerHTML = h;
  const b = document.getElementById("mostraScartate");
  if (b) b.onclick = () => { document.getElementById("scartate").hidden = false; b.hidden = true; };
} else {
  /* ---- B: raccolte per quando le ho salvate, filtro per stato ---- */
  const f = document.getElementById("filtri"); f.hidden = false;
  f.innerHTML = `<button class="on">Tutte <b>${DATI.length}</b></button>` + ORDINE.map(s =>
    `<button><span class="pallino" style="background:var(--s-${s})"></span>${PLUR[s]} <b>${DATI.filter(i=>i.status===s).length}</b></button>`).join("");
  const fasce = [["Questa settimana", 7], ["Questo mese", 30], ["Prima", 1e9]];
  let h = "", usati = new Set();
  for (const [nome, lim] of fasce){
    const g = DATI.filter(i => !usati.has(i) && (now - i.createdAt)/86400000 < lim).sort((x,y)=>y.createdAt-x.createdAt);
    g.forEach(i => usati.add(i));
    if (!g.length) continue;
    h += `<h2 class="gruppo">${nome}<b>${g.length}</b></h2>` + g.map(i => riga(i, true)).join("");
  }
  lista.innerHTML = h;
}
</script>
</body>
</html>
