<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>skill.AI</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#f1f5f9;--mut:#94a3b8;--acc:#38bdf8;
  --s-subito:#f97316;--s-tempo:#38bdf8;--s-giorno:#94a3b8;--s-fatto:#4ade80;--s-drop:#475569;
  --nota:#a5b4fc;--pericolo:#f87171;--velo:#000a}
@media (prefers-color-scheme:light){
  :root{--bg:#f1f5f9;--card:#fff;--line:#e2e8f0;--txt:#0f172a;--mut:#64748b;
    --nota:#4f46e5;--pericolo:#dc2626;--velo:#0f172a66}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--txt);font:17px/1.4 system-ui,sans-serif;padding-bottom:100px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:10px}

/* ---------- Barra in alto: solo nome e lente, 61 px ---------- */
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.testa{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 14px;min-height:60px}
.marchio{font-size:20px;font-weight:700;letter-spacing:-.01em;flex:1}
.tondo{width:44px;height:44px;flex:none;border:0;background:none;color:var(--mut);
  display:grid;place-items:center;border-radius:12px}
.tondo:active,.tondo.on{background:var(--card);color:var(--txt)}
.cerca{padding:0 14px 10px}
.cerca input{width:100%;height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--txt);font-size:17px}

/* ---------- Filtri: vanno a capo, non si tagliano ---------- */
.filtri{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 2px}
.filtri button{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:999px;
  padding:0 14px;height:46px;font-size:15px;display:inline-flex;align-items:center;gap:7px}
.filtri button.on{background:var(--acc);color:#0f172a;border-color:var(--acc);font-weight:600}
.filtri button b{font-weight:700}
.pallino{width:9px;height:9px;border-radius:50%;flex:none}

/* ---------- Titolo di gruppo ---------- */
.gruppo{display:flex;align-items:center;gap:9px;margin:0;padding:20px 14px 7px;font-size:13.5px;
  font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.gruppo b{margin-left:auto;font-weight:700;letter-spacing:0;text-transform:none;font-size:15px}

/* ---------- La riga ---------- */
.riga{display:flex;gap:11px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);
  padding:11px 14px 11px 0;background:var(--card);color:var(--txt);font:inherit;align-items:flex-start}
.riga:first-of-type{border-top:1px solid var(--line)}
.riga:active{background:var(--bg)}
.filo{width:4px;flex:none;align-self:stretch;border-radius:0 4px 4px 0;margin-right:7px}
.tipo{width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:rgba(148,163,184,.14);color:var(--mut);margin-top:1px}
.tipo svg{width:20px;height:20px;display:block}
.corpo{flex:1;min-width:0}
.tit{font-size:18px;font-weight:600;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{margin-top:4px;font-size:14.5px;color:var(--mut);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta .stato{color:var(--txt);font-weight:600}
.nota{margin-top:5px;font-size:14.5px;color:var(--nota);
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.vuoto{text-align:center;color:var(--mut);padding:52px 24px;font-size:16px;line-height:1.5}

/* ---------- Bottone aggiungi ---------- */
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:60px;height:60px;
  border-radius:50%;border:0;background:var(--acc);color:#0f172a;font-size:32px;box-shadow:0 6px 18px #0007;z-index:6}

/* ---------- Fogli che salgono dal basso ---------- */
.foglio{position:fixed;inset:0;background:var(--velo);display:none;align-items:flex-end;z-index:20}
.foglio.show{display:flex}
.foglio .dentro{background:var(--card);width:100%;max-height:92vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));display:grid;gap:12px}
.maniglia{width:42px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 4px}

.d-alto{display:flex;align-items:center;gap:9px;color:var(--mut);font-size:14.5px}
.d-tit{font-size:21px;font-weight:700;line-height:1.25;margin:0}
#dCorpo p{margin:0}
.d-desc{color:var(--mut);font-size:16px;line-height:1.5}
.d-nota{border-left:3px solid var(--nota);padding:2px 0 2px 12px;color:var(--nota);font-size:16px;line-height:1.5}
.d-avviso{color:var(--mut);font-size:15px;line-height:1.45;margin:0}
.d-eti{font-size:13.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.stati{display:flex;gap:6px;flex-wrap:wrap}
.stati button{flex:1 1 46%;min-width:0;height:48px;padding:0 10px;border:1px solid var(--line);background:var(--bg);
  color:var(--txt);border-radius:12px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.stati button.on{border-color:var(--c);background:var(--c);color:#0f172a;font-weight:700}
.stati button.on .pallino{display:none}

.btn{min-height:48px;border:1px solid var(--line);background:var(--bg);color:var(--txt);border-radius:12px;
  padding:0 18px;font-size:17px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:9px}
.btn:active{background:var(--card)}
.btn.p{background:var(--acc);color:#0f172a;border-color:var(--acc);font-weight:700}
.btn.d{color:var(--pericolo);border-color:var(--pericolo)}
.coppia{display:flex;gap:8px}
.coppia .btn{flex:1}
input.f,textarea.f{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg);color:var(--txt);font:inherit}

#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#111e;color:#fff;
  padding:11px 18px;border-radius:999px;font-size:16px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
#toast.show{opacity:1}
#login{display:none;position:fixed;inset:0;background:var(--bg);z-index:40;align-items:center;justify-content:center;padding:20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="testa">
    <span class="marchio">skill.AI</span>
    <button class="tondo" id="bCerca" aria-label="Cerca" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
    </button>
    <button class="tondo" id="logout" aria-label="Esci" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H15"/><path d="M10 8l-4 4 4 4M6 12h9"/></svg>
    </button>
  </div>
  <div class="cerca" id="cerca" hidden><input id="q" type="search" placeholder="Cerca fra i link salvati…"></div>
</header>

<div class="filtri" id="filtri"></div>
<main id="lista"></main>
<button id="fab" aria-label="Aggiungi un link">+</button>

<!-- Scheda del singolo link: prima si legge, poi semmai si modifica -->
<div class="foglio" id="dettaglio" role="dialog" aria-modal="true" aria-label="Link salvato">
  <div class="dentro" id="dCorpo"></div>
</div>

<!-- Aggiunta a mano -->
<div class="foglio" id="nuovo" role="dialog" aria-modal="true" aria-label="Nuovo link">
  <div class="dentro">
    <div class="maniglia"></div>
    <strong>Nuovo link</strong>
    <input class="f" id="nUrl" type="url" placeholder="Incolla il link" inputmode="url">
    <input class="f" id="nTitle" placeholder="Titolo (se lo lasci vuoto lo cerco io)">
    <textarea class="f" id="nDesc" rows="3" placeholder="Descrizione (se la lasci vuota la cerco io)"></textarea>
    <div class="coppia">
      <button class="btn p" id="nSave">Salva</button>
      <button class="btn" id="nCancel">Annulla</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<div id="login">
  <form id="loginForm" style="width:100%;max-width:360px;display:grid;gap:10px">
    <h1 style="margin:0 0 6px;font-size:24px">skill.AI</h1>
    <span style="color:var(--mut);font-size:15px;line-height:1.45">Accedi con l'account del sito (lo stesso dell'Albero). Resterai collegato su questo dispositivo.</span>
    <input class="f" id="lEmail" type="email" placeholder="Email" autocomplete="username" required>
    <input class="f" id="lPass" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn p" type="submit">Accedi</button>
    <span id="lErr" style="color:var(--pericolo);font-size:15px"></span>
  </form>
</div>

<script type="module">
/* ====== CONFIG ====== */
// URL del Worker Cloudflare che legge titolo e descrizione (vedi README). Se vuoto: niente descrizione automatica.
const WORKER_URL = "https://skill-ai-meta.menems-700.workers.dev/";
// Stesso progetto Firebase dell'Albero genealogico. Se null: salvataggio solo locale.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBXM0o09kuJfqt5ekSqazZoTzDFKCR2WxM",
  authDomain: "albero-ceni.firebaseapp.com",
  projectId: "albero-ceni",
  storageBucket: "albero-ceni.firebasestorage.app",
  messagingSenderId: "1075803947573",
  appId: "1:1075803947573:web:2deac571fb99e497c0a77c"
};
// I link stanno in utenti/{uid}/skill-ai: ognuno vede solo i propri (vedi firestore.rules)
const SDK = "https://www.gstatic.com/firebasejs/10.12.5/";
/* ==================== */

/* Gli stati che si possono scegliere sono tre.
   "drop" (Scartata) non si sceglie più: resta solo per i link scartati prima,
   così si vedono ancora nell'elenco e si possono eliminare a mano. */
const STATI  = {subito:"Subito", tempo:"Appena ho tempo", giorno:"Un giorno", fatto:"Fatto"};
const SCELTE = ["subito","tempo","giorno","fatto"];
const NORMALE = "tempo";   // il livello di chi ha solo messo da parte il link

/* I link salvati prima avevano altri nomi. Il valore vecchio resta scritto nel
   database: qui si traduce soltanto per mostrarlo, così si può sempre tornare indietro.
   "drop" (Scartata) non si sceglie più, ma resta riconosciuto per ritrovarle ed eliminarle. */
const VECCHI = {todo:"tempo", tried:"fatto", inst:"fatto"};
const liv = s => STATI[s] ? s : (VECCHI[s] || (s === "drop" ? "drop" : NORMALE));
const etichetta = s => STATI[s] || "Scartata";
const perIlFiltro = s => s === "drop" ? "Scartate" : STATI[s];

const $ = s => document.querySelector(s);
let items = [], filtro = "all", query = "";

/* ---------- Archivio (Firebase oppure localStorage) ---------- */
async function makeStore(){
  if (FIREBASE_CONFIG){
    const app = await import(SDK + "firebase-app.js");
    const fs  = await import(SDK + "firebase-firestore.js");
    const au  = await import(SDK + "firebase-auth.js");
    const fbApp = app.initializeApp(FIREBASE_CONFIG);
    const auth = au.getAuth(fbApp);
    const db = fs.getFirestore(fbApp);

    // Attende l'utente: se non è già collegato mostra il login
    const user = await new Promise(resolve => {
      const stop = au.onAuthStateChanged(auth, u => {
        if (u){ stop(); $("#login").style.display = "none"; resolve(u); }
        else $("#login").style.display = "flex";
      });
      $("#loginForm").onsubmit = async e => {
        e.preventDefault(); $("#lErr").textContent = "";
        try { await au.signInWithEmailAndPassword(auth, $("#lEmail").value.trim(), $("#lPass").value); }
        catch { $("#lErr").textContent = "Accesso non riuscito: controlla email e password."; }
      };
    });
    $("#logout").hidden = false;
    $("#logout").onclick = async () => { await au.signOut(auth); location.reload(); };

    const path = ["utenti", user.uid, "skill-ai"];
    const col = fs.collection(db, ...path);
    const ref = id => fs.doc(db, ...path, id);

    // Porta su Firestore gli eventuali link salvati prima solo sul telefono
    try {
      const old = JSON.parse(localStorage.getItem("skill-ai-v1") || "[]");
      for (const {id, ...o} of old) await fs.addDoc(col, o);
      if (old.length) localStorage.removeItem("skill-ai-v1");
    } catch {}

    return {
      subscribe: cb => fs.onSnapshot(fs.query(col, fs.orderBy("createdAt","desc")),
        snap => cb(snap.docs.map(d => ({id:d.id, ...d.data()}))),
        () => toast("Errore di lettura: controlla le regole Firestore")),
      add: async o => (await fs.addDoc(col, o)).id,
      update: (id,p) => fs.updateDoc(ref(id), p),
      remove: id => fs.deleteDoc(ref(id))
    };
  }
  const K = "skill-ai-v1", subs = [];
  const load = () => { try { return JSON.parse(localStorage.getItem(K)) || []; } catch { return []; } };
  const save = a => { localStorage.setItem(K, JSON.stringify(a)); subs.forEach(f => f(a.slice().sort((x,y)=>y.createdAt-x.createdAt))); };
  return {
    subscribe: cb => { subs.push(cb); cb(load().sort((x,y)=>y.createdAt-x.createdAt)); },
    add: async o => { const a = load(), id = String(Date.now()); a.push({id,...o}); save(a); return id; },
    update: async (id,p) => { const a = load(); const i = a.findIndex(x=>x.id===id); if(i>=0){Object.assign(a[i],p); save(a);} },
    remove: async id => save(load().filter(x=>x.id!==id))
  };
}

/* ---------- Utilità ---------- */
const dominio = u => { try { return new URL(u).hostname.replace(/^www\./,""); } catch { return u; } };
const toast = m => { const t=$("#toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); };
const extractUrl = s => (s||"").match(/https?:\/\/[^\s]+/)?.[0] || "";
const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Dal dominio si capisce che roba è: un video da guardare, un repo o una guida da leggere */
function tipo(u){
  const d = dominio(u);
  if (/instagram|tiktok|youtube|youtu\.be|facebook|threads|vimeo/.test(d)) return "video";
  if (/github|gitlab|huggingface|npmjs|pypi/.test(d)) return "repo";
  return "guida";
}
const SEGNI = {
  video:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="3.5"/><path d="M10 9.3l5 2.7-5 2.7z" fill="currentColor" stroke="none"/></svg>',
  repo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 8L5 12l3.5 4M15.5 8L19 12l-3.5 4"/></svg>',
  guida:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 3.5h9l5 5v12h-14z"/><path d="M14 3.5v5h5M8.5 13h7M8.5 16.5h5"/></svg>'
};
const NOMETIPO = {video:"Video", repo:"Repo", guida:"Guida"};

const quando = t => {
  const d = Math.floor((Date.now() - t)/86400000);
  if (d <= 0) return "oggi";
  if (d === 1) return "ieri";
  if (d < 7) return d + " giorni";
  if (d < 30){ const n = Math.round(d/7); return n === 1 ? "1 settimana" : n + " settimane"; }
  const m = Math.round(d/30); return m === 1 ? "1 mese" : m + " mesi";
};

async function fetchMeta(url){
  if (!WORKER_URL) return null;
  try {
    const r = await fetch(WORKER_URL + "?url=" + encodeURIComponent(url));
    if (!r.ok) return null;
    return cleanMeta(await r.json());
  } catch { return null; }
}

/* Ripulisce titoli e descrizioni dei social (Instagram/TikTok mettono tutta la didascalia nel titolo) */
const decodeHtml = s => { const t = document.createElement("textarea"); t.innerHTML = s || ""; return t.value; };
const cut = (s, n) => s.length > n ? s.slice(0, n).replace(/\s+\S*$/, "") + "…" : s;
const noTags = s => s.replace(/(^|\s)#[\p{L}\p{N}_]+/gu, " ").replace(/\s+/g, " ").trim();
function cleanMeta(m){
  let title = decodeHtml(m.title).trim(), description = decodeHtml(m.description).trim();
  const ig = title.match(/^(.*?)\s+(?:su|on)\s+(Instagram|TikTok|Threads|Facebook)\s*:\s*["“]?([\s\S]*?)["”]?\s*$/i);
  let author = "", caption = "";
  if (ig){ author = ig[1].trim(); caption = ig[3]; }
  else if (/\|\s*TikTok\s*$/i.test(title)){ caption = title.replace(/\|\s*TikTok\s*$/i, ""); }
  if (ig || caption){
    caption = noTags(caption);
    const first = (caption.split(/(?<=[.!?])\s|\n|\s(?=\p{Extended_Pictographic})/u)[0] || caption).trim();
    title = (author ? author + " · " : "") + cut(first, 80);
    if (!description || description.length < caption.length || /\d+\s*(likes|Mi piace)/i.test(description)) description = caption;
  }
  return { title: cut(title, 110), description: cut(noTags(description), 400) };
}

const store = await makeStore();

async function addLink(url, title="", description="", zitto=false){
  const clean = url.trim();
  if (!/^https?:\/\//i.test(clean)) { toast("Link non valido"); return null; }
  const gia = items.find(i => i.url === clean);
  if (gia) { if (!zitto) toast("Già salvato"); return gia.id; }   // restituisce quello vecchio, così si può annotare
  const id = await store.add({url:clean, title:title.trim(), description:description.trim(), status:NORMALE, notes:"", createdAt:Date.now()});
  if (!zitto) toast("Salvato ✔");
  // titolo e descrizione arrivano dopo, senza far aspettare nessuno
  if (!title.trim() || !description.trim()) completaDalWeb(id, clean, title, description);
  return id;
}

async function completaDalWeb(id, url, title, description){
  const m = await fetchMeta(url);
  if (!m) return;
  const patch = {};
  if (!title.trim() && m.title) patch.title = m.title;
  if (!description.trim() && m.description) patch.description = m.description;
  if (Object.keys(patch).length) store.update(id, patch);
}

// aspetta che il link appena salvato arrivi nell'elenco (Firestore risponde con un attimo di ritardo)
async function attendiNellElenco(id, msMax = 5000){
  const t0 = Date.now();
  while (!items.some(i => i.id === id) && Date.now() - t0 < msMax)
    await new Promise(r => setTimeout(r, 80));
  return items.some(i => i.id === id);
}

/* ---------- Fogli: il tasto indietro del telefono li chiude ---------- */
function apriFoglio(el){
  el.classList.add("show");
  document.body.style.overflow = "hidden";
  history.pushState({foglio:el.id}, "");
}
function chiudiFoglio(){
  const el = document.querySelector(".foglio.show");
  if (!el) return;
  el.classList.remove("show");
  document.body.style.overflow = "";
  if (el.id === "dettaglio"){ apertoId = null; inModifica = false; }
}
// chiusura voluta dall'utente: torna indietro, così la cronologia resta pulita
const chiudiTornando = () => { if (document.querySelector(".foglio.show")) history.back(); };
window.addEventListener("popstate", () => {
  // dalla modifica il tasto indietro riporta alla lettura, non chiude tutto
  if (inModifica && document.querySelector("#dettaglio.show")){
    inModifica = false; appenaCondiviso = ""; disegnaDettaglio();
    history.pushState({foglio:"dettaglio"}, "");  // rimette il gradino: il foglio resta aperto
    return;
  }
  chiudiFoglio();
});
document.querySelectorAll(".foglio").forEach(f => {
  f.addEventListener("click", e => { if (e.target === f) chiudiTornando(); });
});

/* ---------- Elenco ---------- */
const FASCE = [["Questa settimana", 7], ["Questo mese", 30], ["Prima", Infinity]];

function rigaHtml(i){
  return `<button class="riga" data-id="${i.id}">
    <span class="filo" style="background:var(--s-${liv(i.status)})"></span>
    <span class="tipo" aria-hidden="true">${SEGNI[tipo(i.url)]}</span>
    <span class="corpo">
      <span class="tit">${esc(decodeHtml(i.title)) || esc(dominio(i.url))}</span>
      <span class="meta">${liv(i.status) === NORMALE ? "" : `<span class="stato">${etichetta(liv(i.status))}</span><span>·</span>`}${esc(dominio(i.url))}<span>·</span>${quando(i.createdAt)}</span>
      ${i.notes ? `<span class="nota">${esc(i.notes)}</span>` : ""}
    </span>
  </button>`;
}

function render(){
  // filtri: "Tutte" più i tre stati, e "Scartate" solo se ne è rimasta qualcuna da prima
  // si mostrano solo i livelli che hanno almeno un link: la fila resta corta
  // e i livelli nuovi compaiono man mano che li usi
  const quanti = s => items.filter(i => liv(i.status) === s).length;
  const presenti = SCELTE.concat("drop").filter(s => quanti(s) > 0);
  $("#filtri").innerHTML =
    `<button data-f="all" class="${filtro==="all"?"on":""}">Tutte <b>${items.length}</b></button>` +
    presenti.map(s => `<button data-f="${s}" class="${filtro===s?"on":""}">
        <span class="pallino" style="background:var(--s-${s})"></span>${perIlFiltro(s)} <b>${quanti(s)}</b>
      </button>`).join("");

  const q = query.toLowerCase();
  const visti = items.filter(i =>
    (filtro === "all" || liv(i.status) === filtro) &&
    (!q || [i.title,i.description,i.notes,i.url].join(" ").toLowerCase().includes(q))
  ).sort((x,y) => y.createdAt - x.createdAt);

  if (!visti.length){
    $("#lista").innerHTML = `<p class="vuoto">${items.length
      ? "Nessun link con questi filtri."
      : "Non c'è ancora niente.<br>Dai social, Condividi → skill.AI."}</p>`;
    return;
  }

  // raccolti per quando sono stati salvati
  let html = "", usati = new Set();
  for (const [nome, giorni] of FASCE){
    const g = visti.filter(i => !usati.has(i) && (Date.now() - i.createdAt)/86400000 < giorni);
    g.forEach(i => usati.add(i));
    if (!g.length) continue;
    html += `<h2 class="gruppo">${nome}<b>${g.length}</b></h2>` + g.map(rigaHtml).join("");
  }
  $("#lista").innerHTML = html;
}

/* ---------- Scheda del link: si legge, e solo se vuoi si modifica ---------- */
let apertoId = null, inModifica = false, toccati = new Set(), appenaCondiviso = "";  // "" | "nuovo" | "gia"

function disegnaDettaglio(){
  const i = items.find(x => x.id === apertoId);
  if (!i){ chiudiFoglio(); return; }
  const st = liv(i.status);

  if (inModifica){
    $("#dCorpo").innerHTML = `
      <div class="maniglia"></div>
      <span class="d-eti">${appenaCondiviso === "nuovo" ? "Salvato · scrivi la tua nota"
                            : appenaCondiviso === "gia" ? "Già salvato · aggiungi una nota" : "Modifica"}</span>
      ${appenaCondiviso && (!i.title || !i.description)
        ? `<p class="d-avviso">Titolo e descrizione li cerco io: compaiono qui sotto fra un attimo.</p>` : ""}
      <textarea class="f" data-k="notes" rows="4" placeholder="Le mie considerazioni…">${esc(i.notes)}</textarea>
      <span class="d-eti">Titolo e descrizione</span>
      <input class="f" data-k="title" placeholder="Titolo" value="${esc(decodeHtml(i.title))}">
      <textarea class="f" data-k="description" rows="4" placeholder="Descrizione">${esc(decodeHtml(i.description))}</textarea>
      <div class="coppia">
        <button class="btn p" data-act="salva">Salva</button>
        <button class="btn" data-act="annulla">Annulla</button>
      </div>`;
    // tiene conto di quali caselle hai toccato, per non scriverci sopra
    $("#dCorpo").querySelectorAll("[data-k]").forEach(el =>
      el.addEventListener("input", () => toccati.add(el.dataset.k)));
    return;
  }
  $("#dCorpo").innerHTML = `
    <div class="maniglia"></div>
    <div class="d-alto">
      <span class="tipo" aria-hidden="true">${SEGNI[tipo(i.url)]}</span>
      <span>${NOMETIPO[tipo(i.url)]} · ${esc(dominio(i.url))} · ${quando(i.createdAt)}</span>
    </div>
    <h2 class="d-tit">${esc(decodeHtml(i.title)) || esc(dominio(i.url))}</h2>
    ${i.description ? `<p class="d-desc">${esc(decodeHtml(i.description))}</p>` : ""}
    ${i.notes ? `<p class="d-nota">${esc(i.notes)}</p>` : ""}
    <a class="btn p" href="${esc(i.url)}" target="_blank" rel="noopener">Apri il link</a>
    <span class="d-eti">Quanto mi interessa</span>
    <div class="stati" role="group" aria-label="Quanto mi interessa">
      ${SCELTE.map(s => `<button data-set="${s}" class="${st===s?"on":""}" aria-pressed="${st===s}" style="--c:var(--s-${s})">
        <span class="pallino" style="background:var(--s-${s})"></span>${STATI[s]}</button>`).join("")}
    </div>
    <div class="coppia">
      <button class="btn" data-act="modifica">Modifica</button>
      <button class="btn d" data-act="elimina">Elimina</button>
    </div>`;
}

/* Mentre scrivi, il titolo e la descrizione trovati dal Worker possono arrivare:
   si infilano solo nelle caselle che non hai toccato e che non hai sotto il dito. */
function aggiornaCaselle(){
  const i = items.find(x => x.id === apertoId); if (!i) return;
  for (const k of ["title","description","notes"]){
    const el = $(`#dCorpo [data-k=${k}]`);
    if (!el || toccati.has(k) || el === document.activeElement) continue;
    const valore = k === "notes" ? (i.notes || "") : decodeHtml(i[k] || "");
    if (el.value !== valore) el.value = valore;
  }
  const avviso = $("#dCorpo .d-avviso");
  if (avviso && i.title && i.description) avviso.remove();
}

function apriDettaglio(id){
  apertoId = id; inModifica = false; appenaCondiviso = ""; toccati = new Set();
  disegnaDettaglio();
  apriFoglio($("#dettaglio"));
}

// dopo una condivisione dal social: la scheda si apre già pronta per la nota
function apriPerLaNota(id, come){
  apertoId = id; inModifica = true; appenaCondiviso = come; toccati = new Set();
  disegnaDettaglio();
  apriFoglio($("#dettaglio"));
  const n = $("#dCorpo [data-k=notes]"); if (n) n.focus();
}

$("#dCorpo").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  const i = items.find(x => x.id === apertoId); if (!i) return;

  if (b.dataset.set){                       // cambio di stato: un tocco, quello che scegli
    if (liv(i.status) !== b.dataset.set) await store.update(apertoId, {status:b.dataset.set});
    chiudiTornando(); return;
  }
  const act = b.dataset.act;
  if (act === "modifica"){ inModifica = true; appenaCondiviso = ""; toccati = new Set(); disegnaDettaglio(); return; }
  if (act === "annulla"){ inModifica = false; appenaCondiviso = ""; disegnaDettaglio(); return; }
  if (act === "salva"){
    const patch = {};
    for (const k of ["title","description","notes"]){
      const el = $(`#dCorpo [data-k=${k}]`); if (!el) continue;
      const vecchio = k === "notes" ? (i.notes || "") : decodeHtml(i[k] || "");
      if (el.value !== vecchio) patch[k] = el.value;   // così non si sovrascrive quello che non hai toccato
    }
    inModifica = false;
    if (Object.keys(patch).length){ await store.update(apertoId, patch); toast("Aggiornato"); }
    chiudiTornando(); return;
  }
  if (act === "elimina"){
    if (!confirm("Eliminare questo link?")) return;
    const id = apertoId; apertoId = null; chiudiTornando(); await store.remove(id); toast("Eliminato");
  }
});

/* ---------- Ricerca e filtri ---------- */
$("#bCerca").onclick = () => {
  const c = $("#cerca"), apri = c.hidden;
  c.hidden = !apri;
  $("#bCerca").classList.toggle("on", apri);
  $("#bCerca").setAttribute("aria-expanded", apri);
  if (apri) $("#q").focus();
  else if (query){ query = ""; $("#q").value = ""; render(); }
};
$("#q").addEventListener("input", e => { query = e.target.value; render(); });
$("#filtri").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  filtro = b.dataset.f; render();
});
$("#lista").addEventListener("click", e => {
  const r = e.target.closest(".riga"); if (r) apriDettaglio(r.dataset.id);
});

/* ---------- Aggiunta a mano ---------- */
$("#fab").onclick = async () => {
  apriFoglio($("#nuovo"));
  try { const t = await navigator.clipboard.readText(); const u = extractUrl(t); if (u && !$("#nUrl").value) $("#nUrl").value = u; } catch {}
};
$("#nCancel").onclick = chiudiTornando;
$("#nSave").onclick = async () => {
  const [u,t,d] = [$("#nUrl").value, $("#nTitle").value, $("#nDesc").value];
  ["#nUrl","#nTitle","#nDesc"].forEach(s => $(s).value = "");
  chiudiTornando();
  await addLink(u, t, d);
};

/* ---------- Avvio e condivisione dai social ---------- */
store.subscribe(a => {
  items = a;
  render();
  if (apertoId && document.querySelector("#dettaglio.show")){
    if (inModifica) aggiornaCaselle();   // non ridisegna: scriveresti sopra alla mia nota
    else disegnaDettaglio();
  }
});
await new Promise(r => setTimeout(r, 400)); // lascia arrivare il primo elenco, per il controllo dei doppioni
const p = new URLSearchParams(location.search);
const shared = extractUrl(p.get("url")) || extractUrl(p.get("text"));
if (shared){
  history.replaceState(null, "", location.pathname);
  const t = p.get("title") || "";
  const nuovo = !items.some(i => i.url === shared);
  const id = await addLink(shared, t.startsWith("http") ? "" : t, "", true);
  if (id && await attendiNellElenco(id)) apriPerLaNota(id, nuovo ? "nuovo" : "gia");
  else if (id) toast("Salvato ✔");   // se la scheda non fa in tempo ad aprirsi, almeno lo dico
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
