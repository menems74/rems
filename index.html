<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REMS — Portale web 2.0</title>
<meta name="description" content="REMS: i miei social e le mie app.">
<meta name="theme-color" content="#eceae4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root{
    --bg:#eceae4; --ink:#111; --paper:#f3f1ea; --muted-dark:#a8a59c;
    --lime:#d7ff3a; --green-live:#b8f35a;
    --radius:28px; --gap:14px;
    --font-display:"Bricolage Grotesque","Inter",sans-serif;
    --font-sans:"Inter","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-display);min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:3px solid var(--ink);outline-offset:4px;border-radius:var(--radius)}

  /* --- Griglia bento --- */
  .bento{min-height:100vh;min-height:100dvh;max-width:1100px;margin:0 auto;padding:clamp(16px,3vw,36px);
    display:grid;gap:var(--gap);grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(150px,auto);align-content:center}
  .cell{border-radius:var(--radius);padding:22px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:18px;
    transition:transform .35s cubic-bezier(.2,1.4,.4,1);opacity:0;transform:translateY(24px) scale(.97);animation:pop .7s cubic-bezier(.2,1.2,.4,1) forwards;animation-delay:var(--d,0s)}
  a.cell:hover{transform:scale(1.025) rotate(-.5deg)}
  a.cell:active{transform:scale(.98)}
  @keyframes pop{to{opacity:1;transform:none}}
  .k{font:600 12px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
  .cell i.big{font-size:42px}
  .go{position:absolute;right:18px;top:18px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:14px;
    background:rgba(255,255,255,.18);transition:transform .3s,background .3s,color .3s}
  a.cell:hover .go{transform:rotate(-45deg);background:var(--ink);color:#fff}

  /* --- Titolo --- */
  .hero{grid-column:span 2;grid-row:span 2;background:var(--ink);color:var(--paper)}
  .hero h1{font-weight:800;font-size:clamp(84px,13vw,170px);line-height:.82;letter-spacing:-.05em}
  .hero p{font:400 16px/1.5 var(--font-sans);color:var(--muted-dark);margin-top:12px}
  .live{display:flex;align-items:center;gap:8px;font:500 13px var(--font-sans);color:var(--green-live)}
  .live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green-live);animation:ping 1.8s infinite}
  @keyframes ping{0%{box-shadow:0 0 0 0 var(--green-live)}70%{box-shadow:0 0 0 10px transparent}}

  /* --- Social, ognuno con i suoi colori --- */
  .ig{background:linear-gradient(135deg,#feda75,#fa7e1e 30%,#d62976 60%,#962fbf 85%);color:#fff}
  .tt{background:#000;color:#fff}
  .tt i.big{text-shadow:-3px -2px 0 #25f4ee,3px 2px 0 #fe2c55}
  .yt{background:#ff0033;color:#fff}
  .li{background:#0a66c2;color:#fff}
  .fb{background:#1877f2;color:#fff}

  /* --- App e orologio --- */
  .apps{grid-column:span 2;background:var(--lime);color:var(--ink)}
  .apps .go{background:rgba(0,0,0,.08)}
  .apps h2{font-weight:800;font-size:clamp(34px,4.4vw,56px);line-height:.95;letter-spacing:-.03em}
  .clock{background:#fff;color:var(--ink)}
  .clock b{font:800 44px var(--font-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}

  @media (max-width:860px){
    .bento{grid-template-columns:repeat(2,1fr);align-content:start}
    .hero,.apps{grid-column:span 2}
    .hero{grid-row:span 1}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.cell{opacity:1;transform:none}}
</style>
</head>
<body>
  <!--
    La home ha solo due cose: i social e il rimando alle app.
    Ogni riquadro usa style="--d:..." per comparire un po' dopo il precedente.
  -->
  <main class="bento">
    <section class="cell hero" style="--d:0s">
      <span class="live">Portale web 2.0</span>
      <div><h1>REMS</h1><p>Il cucchiaio non esiste.</p></div>
    </section>

    <a class="cell ig" style="--d:.06s" href="https://www.instagram.com/rems_2.0_/" target="_blank" rel="noopener noreferrer">
      <span class="go" aria-hidden="true"><i class="fa-solid fa-arrow-right"></i></span>
      <i class="fa-brands fa-instagram big" aria-hidden="true"></i><span class="k">Instagram</span>
    </a>
    <a class="cell tt" style="--d:.12s" href="https://www.tiktok.com/@remsmenems" target="_blank" rel="noopener noreferrer">
      <span class="go" aria-hidden="true"><i class="fa-solid fa-arrow-right"></i></span>
      <i class="fa-brands fa-tiktok big" aria-hidden="true"></i><span class="k">TikTok</span>
    </a>
    <a class="cell yt" style="--d:.18s" href="https://www.youtube.com/@menems" target="_blank" rel="noopener noreferrer">
      <span class="go" aria-hidden="true"><i class="fa-solid fa-arrow-right"></i></span>
      <i class="fa-brands fa-youtube big" aria-hidden="true"></i><span class="k">YouTube</span>
    </a>
    <div class="cell clock" style="--d:.24s">
      <span class="k">Ora in Italia</span><b id="clock">--:--</b>
    </div>

    <a class="cell apps" style="--d:.3s" href="app.html">
      <span class="go" aria-hidden="true"><i class="fa-solid fa-arrow-right"></i></span>
      <span class="k">Portale</span><h2>Le mie app</h2>
    </a>
    <a class="cell li" style="--d:.36s" href="https://www.linkedin.com/in/menems/" target="_blank" rel="noopener noreferrer">
      <span class="go" aria-hidden="true"><i class="fa-solid fa-arrow-right"></i></span>
      <i class="fa-brands fa-linkedin-in big" aria-hidden="true"></i><span class="k">LinkedIn</span>
    </a>
    <a class="cell fb" style="--d:.42s" href="https://www.facebook.com/menems01" target="_blank" rel="noopener noreferrer">
      <span class="go" aria-hidden="true"><i class="fa-solid fa-arrow-right"></i></span>
      <i class="fa-brands fa-facebook-f big" aria-hidden="true"></i><span class="k">Facebook</span>
    </a>
  </main>

<script>
(function(){
  var el = document.getElementById('clock');
  function tick(){ el.textContent = new Date().toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit', timeZone:'Europe/Rome'}); }
  tick(); setInterval(tick, 10000);
})();
</script>
</body>
</html>
