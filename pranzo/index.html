<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pranzo 2.0</title>
<meta name="description" content="Il menù della settimana, pranzo e cena, e la lista della spesa. Funziona senza rete.">
<meta name="theme-color" content="#ffd23f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/icona-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pranzo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>
  /* Il tema prima del primo disegno, per non far lampeggiare il bianco.
     La copia in localStorage è solo un promemoria di aspetto: i dati veri
     stanno in IndexedDB. */
  (function () {
    try {
      var t = localStorage.getItem('pranzo.tema') || 'auto';
      document.documentElement.dataset.tema = t;
      var scuro = t === 'scuro' || (t === 'auto' &&
        window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.style.colorScheme = scuro ? 'dark' : 'light';
    } catch (e) { document.documentElement.dataset.tema = 'auto'; }
  })();
</script>
<script type="module" src="js/app.js"></script>
</head>
<body>

<main id="vista" aria-live="polite"></main>

<nav class="barra" aria-label="Sezioni">
  <a href="#/" data-rotta="casa"><span class="iconaBarra" data-icona="settimana"></span>Settimana</a>
  <a href="#/spesa" data-rotta="spesa"><span class="iconaBarra" data-icona="spesa"></span><span>Spesa<span id="contoSpesa"></span></span></a>
  <a href="#/piatti" data-rotta="piatti"><span class="iconaBarra" data-icona="piatti"></span>Piatti</a>
</nav>

<!-- il foglio che sale dal basso: un giorno, un piatto, una scelta -->
<div id="foglio" hidden>
  <div class="velo" id="foglioVelo"></div>
  <section class="pannello" role="dialog" aria-modal="true" aria-labelledby="foglioTitolo">
    <div class="maniglia" aria-hidden="true"></div>
    <div class="testaFoglio">
      <h2 id="foglioTitolo"></h2>
      <button class="tondo" id="foglioChiudi" type="button" aria-label="Chiudi"></button>
    </div>
    <div class="corpoFoglio" id="foglioCorpo"></div>
  </section>
</div>

<p id="avviso" role="status" hidden></p>

</body>
</html>
