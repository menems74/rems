<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pranzo 2.0</title>
<meta name="description" content="Pianifica i pranzi della settimana e genera la lista della spesa. Funziona senza rete.">
<meta name="theme-color" content="#f6f6f3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/icona-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pranzo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="css/app.css">
<script>
  /* Il tema prima del primo disegno, per non far lampeggiare il bianco.
     La copia in localStorage è solo un promemoria di aspetto: i dati veri
     stanno in IndexedDB. */
  (function () {
    try {
      var t = localStorage.getItem('pranzo.tema') || 'chiaro';
      document.documentElement.dataset.tema = t;
      var scuro = t === 'scuro' || (t === 'auto' &&
        window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.style.colorScheme = scuro ? 'dark' : 'light';
    } catch (e) { document.documentElement.dataset.tema = 'chiaro'; }
  })();
</script>
<script type="module" src="js/app.js"></script>
</head>
<body>

<header>
  <h1 id="titolo">Settimana</h1>
  <p class="sotto">Pranzo 2.0 · <span id="motore">…</span></p>
</header>

<p id="avviso" role="status" hidden></p>

<main id="vista"></main>

<nav aria-label="Sezioni">
  <a href="#/settimana" data-rotta="settimana">Settimana</a>
  <a href="#/spesa" data-rotta="spesa">Spesa</a>
  <a href="#/catalogo" data-rotta="catalogo">Catalogo</a>
  <a href="#/gusti" data-rotta="gusti">Gusti</a>
  <a href="#/altro" data-rotta="altro">Altro</a>
</nav>

<!-- pannello di dettaglio del piatto -->
<section id="pannello" hidden aria-label="Dettaglio piatto">
  <button id="pannelloChiudi" type="button">Chiudi</button>
  <div id="pannelloCorpo"></div>
</section>

</body>
</html>
