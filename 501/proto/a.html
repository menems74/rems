<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>501 · Layout A — Scoreboard doppio</title>
<meta name="theme-color" content="#121212">
<style>
/* ============ TOKEN DI TEMA (condivisi con il layout B) ============ */
:root{
  --bg:#121212;            /* antracite: fondo scuro da specifica */
  --surface:#1c1c1c;       /* card e tasti */
  --surface-hi:#262626;    /* tasto premuto */
  --line:rgba(255,255,255,.10);
  --text:#ffffff;
  --muted:#9b9b95;
  --neon:#00e676;          /* giocatore di turno */
  --neon-soft:rgba(0,230,118,.14);
  --gold:#ffd54f;          /* suggerimento di chiusura */
  --bust:#ff5252;          /* sballo */
  --font:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --num:"DIN Alternate","Bahnschrift","Roboto Condensed",var(--font);
  --key-h:clamp(52px,7.6vh,68px);   /* mai sotto i 50px richiesti */
  --r:14px;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  height:100dvh; overflow:hidden; user-select:none; -webkit-user-select:none;
  display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.app{flex:1; display:flex; flex-direction:column; gap:8px; padding:8px 10px 10px; min-height:0;}

/* ============ HEADER COMPATTO ============ */
header{flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:8px 12px; background:var(--surface); border:1px solid var(--line); border-radius:12px;}
.sl{display:flex; gap:14px; font-family:var(--num); font-size:.82rem; letter-spacing:.06em;}
.sl b{color:var(--muted); font-weight:600; margin-right:5px; font-size:.72rem; letter-spacing:.12em;}
.sl span{font-variant-numeric:tabular-nums;}
.mode{margin-left:auto; font-size:.62rem; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); border:1px solid var(--line); padding:4px 9px; border-radius:999px;}
.ico{width:16px;height:16px;display:block;}

/* ============ CARD GIOCATORI: due colonne, sempre entrambe visibili ============ */
.players{flex:0 0 auto; display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.p{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:10px 12px 9px; overflow:hidden; transition:border-color .2s, box-shadow .2s, background .2s;}
.p .top{display:flex; align-items:center; gap:6px; margin-bottom:2px;}
.p .name{font-size:.82rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.p .darts{margin-left:auto; display:flex; gap:3px;}
.p .darts i{width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.18);}
.p.turn .darts i.on{background:var(--neon);}
.score{font-family:var(--num); font-weight:700; line-height:.92; letter-spacing:-.02em;
  font-size:clamp(46px,15vw,74px); font-variant-numeric:tabular-nums;}
.p .stats{display:flex; gap:10px; margin-top:6px; font-size:.66rem; color:var(--muted);}
.p .stats div{display:flex; flex-direction:column; gap:1px;}
.p .stats b{font-family:var(--num); font-size:.86rem; color:#e9e9e4; font-weight:600; font-variant-numeric:tabular-nums;}
/* giocatore di turno: bordo + bagliore verde neon */
.p.turn{border-color:var(--neon); background:linear-gradient(180deg,var(--neon-soft),transparent 60%),var(--surface);
  box-shadow:0 0 0 1px var(--neon), 0 0 22px rgba(0,230,118,.22);}
.p.turn::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--neon);}
.p.turn .score{color:var(--neon);}
.p.out .score{color:var(--muted);}

/* ============ CHECKOUT HELPER ============ */
.checkout{flex:0 0 auto; display:flex; align-items:center; gap:8px; min-height:36px;
  padding:7px 12px; border-radius:11px; background:rgba(255,213,79,.10); border:1px solid rgba(255,213,79,.30);}
.checkout .lb{font-size:.62rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:700;}
.checkout .combo{margin-left:auto; display:flex; gap:6px;}
.checkout .combo span{font-family:var(--num); font-weight:700; font-size:.92rem; color:#141414;
  background:var(--gold); padding:2px 9px; border-radius:7px;}
.checkout.none{background:transparent; border-color:var(--line);}
.checkout.none .lb{color:var(--muted);}

/* ============ DISPLAY DELL'INPUT ============ */
.entry{flex:0 0 auto; display:flex; align-items:center; gap:12px;
  padding:8px 14px; border-radius:12px; background:var(--surface); border:1px solid var(--line);}
.entry .lb{font-size:.62rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);}
.entry .val{margin-left:auto; font-family:var(--num); font-size:2.1rem; font-weight:700; line-height:1;
  font-variant-numeric:tabular-nums; min-width:3ch; text-align:right;}
.entry .val.empty{color:#4a4a46;}
.entry .rest{font-size:.68rem; color:var(--muted); white-space:nowrap;}
.entry.bust{border-color:var(--bust); background:rgba(255,82,82,.14); animation:shake .4s;}
.entry.bust .val,.entry.bust .lb{color:var(--bust);}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* ============ TASTIERA ============ */
.pad{flex:1 1 auto; display:grid; gap:7px; min-height:0;
  grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,minmax(var(--key-h),1fr));}
.k{display:grid; place-items:center; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); color:var(--text); font-family:var(--num); font-size:1.7rem; font-weight:600;
  touch-action:manipulation; cursor:pointer; transition:transform .07s, background .12s, border-color .12s;}
.k:active{background:var(--surface-hi); border-color:rgba(255,255,255,.22); transform:scale(.955);}
.k:focus-visible{outline:2px solid var(--neon); outline-offset:2px;}
.k[disabled]{opacity:.34; cursor:default; pointer-events:none;}
.k.fn{font-family:var(--font); font-size:.78rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:#dcdcd6; background:#191919; flex-direction:column; gap:3px;}
.k.fn .ico{margin-bottom:2px;}
.k.del{color:var(--bust);} .k.del .ico{stroke:var(--bust);}
.k.undo{color:var(--gold);} .k.undo .ico{stroke:var(--gold);}
.k.enter{grid-row:span 2; background:var(--neon); color:#08130c; border-color:transparent;
  font-family:var(--font); font-size:.9rem; font-weight:800; letter-spacing:.12em;}
.k.enter:active{background:#00c964;}
.k.zero{grid-column:span 3;}

/* ============ ESITO LEG: pannello dal basso, non blocca la lettura ============ */
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:9; transform:translateY(110%);
  transition:transform .32s cubic-bezier(.22,1,.36,1);
  background:#181818; border-top:2px solid var(--neon); border-radius:18px 18px 0 0;
  padding:16px 18px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -18px 40px rgba(0,0,0,.55);}
.sheet.show{transform:translateY(0);}
.sheet h2{font-size:1.05rem; display:flex; align-items:center; gap:8px;}
.sheet h2 em{font-style:normal; color:var(--neon);}
.sheet p{color:var(--muted); font-size:.82rem; margin:6px 0 14px;}
.sheet .row{display:flex; gap:10px;}
.sheet button{flex:1; min-height:50px; border-radius:12px; border:1px solid var(--line); background:var(--surface);
  color:var(--text); font:inherit; font-weight:600; font-size:.9rem; cursor:pointer;}
.sheet button.primary{background:var(--neon); color:#08130c; border-color:transparent; font-weight:800;}
.toast{position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top)); transform:translate(-50%,-160%);
  z-index:10; background:var(--bust); color:#fff; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
  font-size:.78rem; padding:11px 20px; border-radius:999px; transition:transform .25s; box-shadow:0 8px 26px rgba(0,0,0,.5);}
.toast.show{transform:translate(-50%,0);}

/* barra solo-prototipo */
.demo{position:fixed; bottom:calc(6px + env(safe-area-inset-bottom)); left:8px; z-index:11; display:flex; gap:6px;}
.demo button{font:600 .62rem/1 var(--font); letter-spacing:.08em; text-transform:uppercase; color:#bdbdb7;
  background:rgba(0,0,0,.72); border:1px solid var(--line); border-radius:999px; padding:6px 10px; cursor:pointer;}
@media (min-width:560px){ .app{max-width:520px; margin:0 auto; width:100%;} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="sl"><span><b>SET</b>1&nbsp;-&nbsp;0</span><span><b>LEG</b>2&nbsp;-&nbsp;1</span></div>
    <span class="mode">Totale</span>
  </header>

  <section class="players">
    <div class="p turn" id="p1">
      <div class="top">
        <span class="name">Roberto</span>
        <span class="darts"><i class="on"></i><i class="on"></i><i></i></span>
      </div>
      <div class="score" id="s1">124</div>
      <div class="stats">
        <div>Media 3<b>58.4</b></div>
        <div>Frecce<b>15</b></div>
        <div>Ultimo<b>60</b></div>
      </div>
    </div>
    <div class="p out">
      <div class="top">
        <span class="name">Marco</span>
        <span class="darts"><i></i><i></i><i></i></span>
      </div>
      <div class="score">301</div>
      <div class="stats">
        <div>Media 3<b>44.1</b></div>
        <div>Frecce<b>12</b></div>
        <div>Ultimo<b>41</b></div>
      </div>
    </div>
  </section>

  <div class="checkout" id="co">
    <span class="lb">Chiusura</span>
    <span class="combo"><span>T20</span><span>D32</span></span>
  </div>

  <div class="entry" id="entry">
    <span class="lb">Turno</span>
    <span class="rest" id="rest">restano 124</span>
    <span class="val empty" id="val">0</span>
  </div>

  <div class="pad">
    <button class="k" data-d="1">1</button>
    <button class="k" data-d="2">2</button>
    <button class="k" data-d="3">3</button>
    <button class="k fn del" id="del" aria-label="Cancella cifra">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 6H9l-5 6 5 6h11a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1zM17 9l-5 6M12 9l5 6"/></svg>
      Canc
    </button>

    <button class="k" data-d="4">4</button>
    <button class="k" data-d="5">5</button>
    <button class="k" data-d="6">6</button>
    <button class="k fn undo" id="undo" aria-label="Annulla turno">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6M3.5 13a9 9 0 1 0 2.6-6.4L3 9"/></svg>
      Undo
    </button>

    <button class="k" data-d="7">7</button>
    <button class="k" data-d="8">8</button>
    <button class="k" data-d="9">9</button>
    <button class="k enter" id="enter">Invio</button>

    <button class="k zero" data-d="0">0</button>
  </div>
</div>

<p class="toast" id="toast">Sballo — turno annullato</p>

<div class="sheet" id="sheet">
  <h2>Leg vinto da <em>Roberto</em></h2>
  <p>13 freccette · media 3 freccette 58.4 · chiusura D20</p>
  <div class="row">
    <button id="closeSheet">Dettagli</button>
    <button class="primary" id="nextLeg">Prossimo leg</button>
  </div>
</div>

<div class="demo">
  <button id="dBust">Sballo</button>
  <button id="dWin">Leg vinto</button>
</div>

<script>
(function(){
  var buf = '', REST = 124;
  var val = document.getElementById('val'), entry = document.getElementById('entry'),
      rest = document.getElementById('rest'), toast = document.getElementById('toast'),
      sheet = document.getElementById('sheet'), enter = document.getElementById('enter');

  function paint(){
    val.textContent = buf === '' ? '0' : buf;
    val.classList.toggle('empty', buf === '');
    var n = parseInt(buf || '-1', 10);
    // punteggi impossibili con 3 freccette
    var impossible = [163,166,169,172,173,175,176,178,179];
    var ok = buf !== '' && n >= 0 && n <= 180 && impossible.indexOf(n) < 0;
    enter.disabled = !ok;
    rest.textContent = buf === '' ? 'restano ' + REST : (n > REST ? 'sballo' : 'restano ' + Math.max(0, REST - n));
  }
  function tap(){ if(navigator.vibrate) navigator.vibrate(12); }

  document.querySelectorAll('.k[data-d]').forEach(function(k){
    k.addEventListener('click', function(){
      if(buf.length < 3){ buf = (buf === '0' ? '' : buf) + k.dataset.d; paint(); tap(); }
    });
  });
  document.getElementById('del').addEventListener('click', function(){ buf = buf.slice(0,-1); paint(); tap(); });
  document.getElementById('undo').addEventListener('click', function(){ buf = ''; paint(); tap(); });
  enter.addEventListener('click', function(){ buf = ''; paint(); tap(); });

  function bust(){
    entry.classList.add('bust'); toast.classList.add('show');
    if(navigator.vibrate) navigator.vibrate([40,60,40]);
    setTimeout(function(){ entry.classList.remove('bust'); toast.classList.remove('show'); buf=''; paint(); }, 1900);
  }
  document.getElementById('dBust').addEventListener('click', bust);
  document.getElementById('dWin').addEventListener('click', function(){ sheet.classList.add('show'); });
  document.getElementById('closeSheet').addEventListener('click', function(){ sheet.classList.remove('show'); });
  document.getElementById('nextLeg').addEventListener('click', function(){ sheet.classList.remove('show'); });
  paint();
})();
</script>
</body>
</html>
