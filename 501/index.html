<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il 501 si è spostato — REMS</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="3; url=https://menems74.github.io/fanta-dart/">
<style>
  :root{color-scheme:dark;}
  body{margin:0; min-height:100vh; display:grid; place-items:center; text-align:center;
    background:#121212; color:#f5f1ea; font:16px/1.6 "Inter","Segoe UI",system-ui,sans-serif; padding:24px;}
  .box{max-width:420px;}
  h1{font-size:1.3rem; margin:0 0 10px;}
  p{color:#9b9b95; font-size:.92rem; margin:0 0 18px;}
  a{display:inline-block; background:#9bb08d; color:#1c1c18; font-weight:700; text-decoration:none;
    padding:14px 24px; border-radius:999px;}
</style>
</head>
<body>
  <div class="box">
    <h1>Il 501 si è spostato</h1>
    <p>I giochi di freccette adesso stanno in <b>Fanta Dart</b>, a un altro indirizzo. Ti porto lì.</p>
    <a href="https://menems74.github.io/fanta-dart/">Vai a Fanta Dart</a>
  </div>
<script>
  // il vecchio service worker del 501 va tolto, o l'icona sul telefono
  // continua ad aprire la app di prima
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(function(rs){
      rs.forEach(function(r){ if(r.scope.indexOf('/501/') > -1) r.unregister(); });
    }).catch(function(){});
  }
  if(window.caches){
    caches.keys().then(function(ks){ ks.forEach(function(k){ if(k.indexOf('501-') === 0) caches.delete(k); }); }).catch(function(){});
  }
  setTimeout(function(){ location.replace('https://menems74.github.io/fanta-dart/'); }, 1200);
</script>
</body>
</html>
