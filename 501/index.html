<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La app si chiama Dart — REMS</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../dart/icons/favicon-64.png" sizes="64x64" type="image/png">
<meta http-equiv="refresh" content="3; url=../dart/">
<style>
  :root{color-scheme:dark;}
  body{margin:0; min-height:100vh; display:grid; place-items:center; text-align:center;
    background:#121212; color:#f5f1ea; font:16px/1.6 "Inter","Segoe UI",system-ui,sans-serif; padding:24px;}
  .box{max-width:420px;}
  h1{font-size:1.3rem; margin:0 0 10px;}
  p{color:#9b9b95; font-size:.92rem; margin:0 0 18px;}
  a{display:inline-block; background:#00e676; color:#08130c; font-weight:800; text-decoration:none;
    padding:14px 24px; border-radius:999px;}
</style>
</head>
<body>
  <div class="box">
    <h1>Il 501 è dentro la app Dart</h1>
    <p>Questo indirizzo non è più in uso: la app di allenamento si chiama <b>Dart</b> e raccoglie il 501 insieme agli altri giochi. Ti porto lì.</p>
    <a href="../dart/">Vai alla app Dart</a>
  </div>
<script>
  // toglie di mezzo il vecchio service worker, poi passa alla nuova pagina
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(function(rs){
      rs.forEach(function(r){ if(r.scope.indexOf('/501/') > -1) r.unregister(); });
    }).catch(function(){});
  }
  if(window.caches){
    caches.keys().then(function(ks){ ks.forEach(function(k){ if(k.indexOf('501-') === 0) caches.delete(k); }); }).catch(function(){});
  }
  setTimeout(function(){ location.replace('../dart/'); }, 1200);
</script>
</body>
</html>
