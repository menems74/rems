<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Estrazione Torneo — REMS</title>
<meta name="description" content="Sorteggio delle coppie del primo turno: sedici giocatori, chi c'è e chi è Bye.">
<meta name="theme-color" content="#eceae4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Stessi colori e stesse forme del portale: questa è una app di casa.
     La differenza è la misura: lo schermo si guarda dal bancone, non da
     trenta centimetri, quindi i nomi sono grandi il doppio del solito. */
  :root{
    --bg:#eceae4; --ink:#111; --paper:#f3f1ea; --muted:#6b6860; --muted-dark:#a8a59c;
    --lime:#d7ff3a; --green-live:#b8f35a; --rosso:#d4341f;
    --radius:28px; --gap:14px;
    --font-display:"Bricolage Grotesque","Inter",sans-serif;
    --font-sans:"Inter","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font-display);
    min-height:100vh; min-height:100dvh; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:3px solid var(--ink);outline-offset:4px;border-radius:8px}

  .pagina{
    max-width:1100px; margin:0 auto;
    padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 140px max(16px,env(safe-area-inset-left));
  }

  /* --- barra in alto, come nelle altre pagine --- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:14px 0}
  .back{display:inline-flex;align-items:center;gap:10px;padding:10px 18px 10px 12px;border-radius:999px;
    background:var(--ink);color:var(--paper);font:600 14px var(--font-sans);min-height:44px}
  .back .dot{width:28px;height:28px;border-radius:50%;background:var(--lime);color:var(--ink);
    display:grid;place-items:center;font-size:15px;line-height:1}
  .conta{font:600 14px var(--font-sans);color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
  .conta b{color:var(--ink)}
  .pallino{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--green-live);margin-right:6px}
  .pallino.bye{background:var(--muted-dark)}

  /* --- testata --- */
  .testata{background:var(--ink);color:var(--paper);border-radius:var(--radius);padding:26px 24px;margin-bottom:var(--gap)}
  .testata h1{font-size:clamp(38px,8vw,72px);font-weight:800;line-height:.95;letter-spacing:-.03em}
  .testata p{font:400 16px/1.45 var(--font-sans);color:var(--muted-dark);margin-top:10px;max-width:46ch}

  /* --- i sedici --- */
  .strumenti{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 var(--gap)}
  .strumenti button{background:transparent;border:2px solid var(--ink);border-radius:999px;
    padding:0 18px;min-height:44px;font:600 14px var(--font-sans)}
  .strumenti button:active{background:var(--ink);color:var(--paper)}

  .elenco{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .giocatore{
    display:flex;align-items:center;gap:12px;background:var(--paper);
    border-radius:18px;padding:10px 12px;min-height:68px;min-width:0;
  }
  .giocatore.assente{background:#e4e2db}
  .num{
    flex:none;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--paper);
    display:grid;place-items:center;font:800 16px var(--font-display);
  }
  .giocatore.assente .num{background:var(--muted-dark);color:var(--ink)}
  .nome{
    flex:1 1 auto;min-width:0;width:100%;background:transparent;border:0;outline:0;padding:4px 2px;
    font:800 clamp(19px,2.4vw,26px)/1.15 var(--font-display);color:var(--ink);letter-spacing:-.02em;
    border-bottom:2px dashed transparent;
  }
  .nome:focus{border-bottom-color:var(--ink)}
  .giocatore.assente .nome{color:var(--muted)}
  .stato{flex:none;display:flex;background:#dedbd3;border-radius:999px;padding:3px}
  .stato button{
    border:0;background:transparent;border-radius:999px;min-height:40px;padding:0 14px;
    font:600 14px var(--font-sans);color:var(--muted);
  }
  .stato button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .stato button.bye[aria-pressed="true"]{background:var(--muted);color:var(--paper)}

  /* --- la barra con il pulsantone, sempre a portata di pollice --- */
  body.conCoppie .pagina{padding-bottom:210px}
  .barra{
    position:fixed;left:0;right:0;bottom:0;z-index:5;background:linear-gradient(transparent,var(--bg) 26%);
    padding:24px max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  }
  .barra .dentro{max-width:1100px;margin:0 auto}
  .avvia{
    display:flex;align-items:center;justify-content:center;gap:14px;width:100%;
    min-height:84px;border:0;border-radius:var(--radius);background:var(--lime);color:var(--ink);
    font:800 clamp(24px,4.4vw,34px) var(--font-display);letter-spacing:-.02em;
    box-shadow:0 10px 0 #a8c82a;transition:transform .12s,box-shadow .12s;
  }
  .avvia:active{transform:translateY(6px);box-shadow:0 4px 0 #a8c82a}
  .avvia[disabled]{background:#d8d5cd;color:var(--muted);box-shadow:none;cursor:not-allowed}
  .avviso{
    margin-top:10px;text-align:center;font:600 15px var(--font-sans);color:var(--rosso);
  }
  .avviso:empty{display:none}

  /* --- il conto alla rovescia --- */
  .sipario{
    position:fixed;inset:0;z-index:20;background:var(--ink);color:var(--paper);
    display:grid;place-items:center;text-align:center;padding:24px;
  }
  .sipario[hidden]{display:none!important}
  .sipario .scritta{font:600 clamp(18px,4vw,28px) var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
  .sipario .numero{
    font:800 clamp(140px,44vw,320px)/1 var(--font-display);letter-spacing:-.04em;
    font-variant-numeric:tabular-nums;
  }
  .sipario .numero.battito{animation:battito .9s ease-out}
  @keyframes battito{from{transform:scale(.72);opacity:.2}to{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){.sipario .numero.battito{animation:none}.avvia{transition:none}}

  /* --- il tabellone --- */
  .coppie{display:grid;gap:10px}
  .coppia{
    display:grid;grid-template-columns:58px 1fr auto 1fr;align-items:center;gap:14px;
    background:var(--paper);border-radius:20px;padding:16px 18px;
  }
  .coppia .n{
    width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--lime);
    display:grid;place-items:center;font:800 20px var(--font-display);
  }
  .coppia .g{font:800 clamp(22px,3.6vw,40px)/1.05 var(--font-display);letter-spacing:-.025em;min-width:0;overflow-wrap:anywhere}
  .coppia .g.destra{text-align:right}
  .coppia .vs{font:600 14px var(--font-sans);color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
  .coppia.conbye{background:#e4e2db}
  .coppia .g.bye{color:var(--muted)}
  .passa{
    grid-column:1 / -1;font:600 14px var(--font-sans);color:var(--muted);
    border-top:1px solid #d5d2ca;padding-top:10px;margin-top:4px;
  }
  @media (max-width:420px){
    .stato button{padding:0 11px;font-size:13px}
    .num{width:34px;height:34px;font-size:15px}
  }
  @media (max-width:620px){
    .elenco{grid-template-columns:minmax(0,1fr)}
    .coppia{grid-template-columns:46px 1fr;row-gap:6px}
    .coppia .n{grid-row:span 2}
    .coppia .vs{grid-column:2;justify-self:start}
    .coppia .g.destra{text-align:left}
  }
</style>
</head>
<body>

<div class="pagina">
  <div class="top">
    <a class="back" href="../app.html"><span class="dot" aria-hidden="true">&#8592;</span>App</a>
    <p class="conta" id="conta"></p>
  </div>

  <!-- ===== schermata 1: chi c'è ===== -->
  <section id="vistaElenco">
    <div class="testata">
      <h1>Estrazione Torneo</h1>
      <p>Segna chi c'è e chi è Bye, poi avvia. Il sorteggio accoppia i sedici a caso
         per il primo turno, e non fa mai incontrare due Bye.</p>
    </div>

    <div class="strumenti">
      <button type="button" id="tuttiPresenti">Tutti presenti</button>
      <button type="button" id="nomiDaCapo">Rimetti i nomi</button>
    </div>

    <div class="elenco" id="elenco"></div>
  </section>

  <!-- ===== schermata 2: le coppie ===== -->
  <section id="vistaCoppie" hidden>
    <div class="testata">
      <h1>Primo turno</h1>
      <p id="riassunto"></p>
    </div>
    <div class="coppie" id="coppie"></div>
  </section>
</div>

<div class="barra">
  <div class="dentro">
    <button class="avvia" type="button" id="avvia">Avvia estrazione</button>
    <p class="avviso" id="avviso" role="status"></p>
  </div>
</div>

<div class="sipario" id="sipario" hidden aria-live="assertive" aria-busy="true">
  <div>
    <p class="scritta">Estrazione in corso</p>
    <p class="numero" id="numero">3</p>
  </div>
</div>

<script>
(function(){
  'use strict';

  var QUANTI = 16;
  var CHIAVE = 'rems:torneo:giocatori';

  /* --------------------------------------------------------- i giocatori - */
  var giocatori = carica();

  function vuoti(){
    var a = [];
    for(var i = 0; i < QUANTI; i++) a.push({ nome: '', bye: false });
    return a;
  }
  function carica(){
    try{
      var g = JSON.parse(localStorage.getItem(CHIAVE));
      if(Array.isArray(g) && g.length === QUANTI){
        return g.map(function(x){ return { nome: String(x.nome || ''), bye: !!x.bye }; });
      }
    }catch(e){ /* niente memoria: si riparte puliti */ }
    return vuoti();
  }
  function salva(){
    try{ localStorage.setItem(CHIAVE, JSON.stringify(giocatori)); }catch(e){}
  }
  function nomeDi(i){
    return giocatori[i].nome.trim() || ('Giocatore ' + (i + 1));
  }

  /* ------------------------------------------------------------- il caso -
     Fisher-Yates con i numeri casuali del browser: ogni ordine ha la stessa
     probabilita'. Il resto del modulo (% max) darebbe un filo di vantaggio
     ai primi numeri, quindi i valori oltre il limite si buttano.          */
  function sorte(max){
    if(window.crypto && window.crypto.getRandomValues){
      var limite = Math.floor(4294967296 / max) * max;
      var v = new Uint32Array(1), x;
      do{ window.crypto.getRandomValues(v); x = v[0]; }while(x >= limite);
      return x % max;
    }
    return Math.floor(Math.random() * max);
  }
  function mescola(a){
    for(var i = a.length - 1; i > 0; i--){
      var j = sorte(i + 1), t = a[i];
      a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ---------------------------------------------------------- l'estrazione -
     I Bye prima: ognuno prende un presente a caso, cosi' due Bye non si
     incontrano mai. I presenti che restano si accoppiano fra loro. Alla
     fine si mescola anche l'ordine dei campi, se no i Bye finiscono
     sempre in cima.                                                       */
  function estrai(){
    var presenti = [], bye = [];
    for(var i = 0; i < QUANTI; i++){
      (giocatori[i].bye ? bye : presenti).push({ indice: i, nome: nomeDi(i), bye: giocatori[i].bye });
    }
    if(bye.length > presenti.length) return null;

    mescola(presenti); mescola(bye);

    var coppie = [];
    for(var b = 0; b < bye.length; b++){
      coppie.push({ uno: presenti.pop(), due: bye[b] });
    }
    while(presenti.length >= 2){
      var x = presenti.pop(), y = presenti.pop();
      if(sorte(2)) { var s = x; x = y; y = s; }     // anche il lato e' a caso
      coppie.push({ uno: x, due: y });
    }
    return mescola(coppie);
  }

  /* ------------------------------------------------------ la prima lista - */
  var elenco = document.getElementById('elenco');

  function disegnaElenco(){
    elenco.innerHTML = '';
    giocatori.forEach(function(g, i){
      var riga = document.createElement('div');
      riga.className = 'giocatore' + (g.bye ? ' assente' : '');

      var n = document.createElement('span');
      n.className = 'num'; n.textContent = String(i + 1);

      var nome = document.createElement('input');
      nome.className = 'nome'; nome.type = 'text';
      nome.value = g.nome;
      nome.placeholder = 'Giocatore ' + (i + 1);
      nome.setAttribute('aria-label', 'Nome del giocatore ' + (i + 1));
      nome.setAttribute('autocomplete', 'off');
      nome.addEventListener('input', function(){
        giocatori[i].nome = nome.value; salva(); aggiornaConta();
      });

      var stato = document.createElement('span');
      stato.className = 'stato';
      stato.setAttribute('role', 'group');
      stato.setAttribute('aria-label', 'Stato del giocatore ' + (i + 1));
      stato.appendChild(tasto('Presente', !g.bye, function(){ cambia(i, false); }));
      stato.appendChild(tasto('Bye', g.bye, function(){ cambia(i, true); }, 'bye'));

      riga.appendChild(n); riga.appendChild(nome); riga.appendChild(stato);
      elenco.appendChild(riga);
    });
    aggiornaConta();
  }

  function tasto(testo, acceso, quandoTocchi, classe){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = classe || '';
    b.textContent = testo;
    b.setAttribute('aria-pressed', acceso ? 'true' : 'false');
    b.addEventListener('click', quandoTocchi);
    return b;
  }

  function cambia(i, bye){
    giocatori[i].bye = bye; salva(); disegnaElenco();
  }

  function quantiBye(){
    return giocatori.filter(function(g){ return g.bye; }).length;
  }

  function aggiornaConta(){
    var b = quantiBye(), p = QUANTI - b;
    document.getElementById('conta').innerHTML =
      '<span><span class="pallino"></span><b>' + p + '</b> presenti</span>' +
      '<span><span class="pallino bye"></span><b>' + b + '</b> bye</span>';

    var troppi = b > QUANTI / 2;
    var avvia = document.getElementById('avvia');
    avvia.disabled = troppi;
    document.getElementById('avviso').textContent = troppi
      ? 'Troppi Bye: al massimo 8, se no due Bye finirebbero per forza uno contro l\'altro.'
      : '';
  }

  /* -------------------------------------------------- conto alla rovescia - */
  function contoAllaRovescia(quando){
    var sipario = document.getElementById('sipario');
    var numero = document.getElementById('numero');
    var n = 3;

    sipario.hidden = false;
    mostra(n);

    var passo = setInterval(function(){
      n--;
      if(n === 0){
        clearInterval(passo);
        sipario.hidden = true;
        quando();
        return;
      }
      mostra(n);
    }, 1000);

    function mostra(v){
      numero.textContent = String(v);
      numero.classList.remove('battito');
      void numero.offsetWidth;          // riavvia l'animazione
      numero.classList.add('battito');
    }
  }

  /* ----------------------------------------------------- il tabellone ---- */
  function mostraCoppie(coppie){
    var dove = document.getElementById('coppie');
    dove.innerHTML = '';

    coppie.forEach(function(c, i){
      var riga = document.createElement('div');
      riga.className = 'coppia' + ((c.uno.bye || c.due.bye) ? ' conbye' : '');

      var n = document.createElement('span');
      n.className = 'n'; n.textContent = String(i + 1);

      var a = document.createElement('span');
      a.className = 'g' + (c.uno.bye ? ' bye' : '');
      a.textContent = c.uno.bye ? 'BYE' : c.uno.nome;

      var vs = document.createElement('span');
      vs.className = 'vs'; vs.textContent = 'contro';

      var b = document.createElement('span');
      b.className = 'g destra' + (c.due.bye ? ' bye' : '');
      b.textContent = c.due.bye ? 'BYE' : c.due.nome;

      riga.appendChild(n); riga.appendChild(a); riga.appendChild(vs); riga.appendChild(b);

      if(c.uno.bye || c.due.bye){
        var chi = c.uno.bye ? c.due.nome : c.uno.nome;
        var p = document.createElement('span');
        p.className = 'passa';
        p.textContent = chi + ' passa il turno';
        riga.appendChild(p);
      }
      dove.appendChild(riga);
    });

    var b2 = quantiBye();
    document.getElementById('riassunto').textContent =
      coppie.length + ' partite' + (b2 ? ', di cui ' + b2 + ' con un bye' : '') +
      '. Sorteggio fatto adesso, ordine dei campi compreso.';

    document.getElementById('vistaElenco').hidden = true;
    document.getElementById('vistaCoppie').hidden = false;
    document.body.classList.add('conCoppie');
    window.scrollTo(0, 0);

    var avvia = document.getElementById('avvia');
    avvia.textContent = 'Rifai l\'estrazione';
    mettiTornaIndietro();
  }

  function mettiTornaIndietro(){
    if(document.getElementById('torna')) return;
    var b = document.createElement('button');
    b.id = 'torna'; b.type = 'button';
    b.textContent = 'Modifica i giocatori';
    b.style.cssText = 'display:block;margin:12px auto 0;background:transparent;border:0;' +
                      'font:600 16px var(--font-sans);color:var(--muted);min-height:44px;' +
                      'text-decoration:underline;text-underline-offset:4px';
    b.addEventListener('click', function(){
      document.getElementById('vistaCoppie').hidden = true;
      document.getElementById('vistaElenco').hidden = false;
      document.body.classList.remove('conCoppie');
      document.getElementById('avvia').textContent = 'Avvia estrazione';
      b.remove();
      window.scrollTo(0, 0);
    });
    document.querySelector('.barra .dentro').appendChild(b);
  }

  /* ------------------------------------------------------------ il via --- */
  document.getElementById('avvia').addEventListener('click', function(){
    var coppie = estrai();
    if(!coppie){ aggiornaConta(); return; }
    contoAllaRovescia(function(){ mostraCoppie(coppie); });
  });

  document.getElementById('tuttiPresenti').addEventListener('click', function(){
    giocatori.forEach(function(g){ g.bye = false; });
    salva(); disegnaElenco();
  });

  document.getElementById('nomiDaCapo').addEventListener('click', function(){
    giocatori = vuoti(); salva(); disegnaElenco();
  });

  disegnaElenco();
})();
</script>
</body>
</html>
