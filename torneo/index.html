<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Estrazione Torneo — REMS</title>
<meta name="description" content="Sorteggio delle coppie del primo turno: sedici giocatori, chi c'è e chi è Bye.">
<meta name="theme-color" content="#eceae4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Stessi colori e stesse forme del portale: questa è una app di casa.
     La differenza è la misura: lo schermo si guarda dal bancone, non da
     trenta centimetri, quindi i nomi sono grandi il doppio del solito. */
  :root{
    --bg:#eceae4; --ink:#111; --paper:#f3f1ea; --muted:#6b6860; --muted-dark:#a8a59c;
    --lime:#d7ff3a; --green-live:#b8f35a; --rosso:#d4341f;
    /* superfici e dettagli: tutto da qui, così si cambia palette in un colpo */
    /* i ruoli: chi cambia palette tocca solo questi */
    --blocco:#111;              /* i blocchi pieni: testata, pill, numeri */
    --su-blocco:#f3f1ea;        /* il testo sopra i blocchi */
    --evidenza:#d7ff3a;         /* il numero che salta all'occhio */
    --azione:#d7ff3a;           /* il pulsantone */
    --su-azione:#111;
    --carta-spenta:#e5e3dc;     /* le schede di chi è bye */
    --carta-fatta:#e2e0d8;      /* la partita già chiamata */
    --scanalatura:#dedbd3;      /* la culla dei tasti presente/bye */
    --filo:#d5d2ca;             /* i filetti sottili */
    --ombra-tasto:#a8c82a;      /* lo spessore sotto il pulsantone */
    --tasto-spento:#d8d5cd;
    --radius:28px; --gap:14px;
    --font-display:"Bricolage Grotesque","Inter",sans-serif;
    --font-sans:"Inter","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font-display);
    min-height:100vh; min-height:100dvh; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:3px solid var(--ink);outline-offset:4px;border-radius:8px}

  .pagina{
    max-width:1100px; margin:0 auto;
    padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 140px max(16px,env(safe-area-inset-left));
  }

  /* --- barra in alto, come nelle altre pagine --- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:14px 0}
  .back{display:inline-flex;align-items:center;gap:10px;padding:10px 18px 10px 12px;border-radius:999px;
    background:var(--blocco);color:var(--su-blocco);font:600 14px var(--font-sans);min-height:44px}
  .back .dot{width:28px;height:28px;border-radius:50%;background:var(--evidenza);color:var(--blocco);
    display:grid;place-items:center;font-size:15px;line-height:1}
  .conta{font:600 14px var(--font-sans);color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
  .conta b{color:var(--ink)}
  .pallino{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--green-live);margin-right:6px}
  .pallino.bye{background:var(--muted-dark)}

  /* --- testata --- */
  .testata{background:var(--blocco);color:var(--su-blocco);border-radius:var(--radius);padding:26px 24px;margin-bottom:var(--gap)}
  .testata h1{font-size:clamp(38px,8vw,72px);font-weight:800;line-height:.95;letter-spacing:-.03em}
  .testata p{font:400 16px/1.45 var(--font-sans);color:var(--muted-dark);margin-top:10px;max-width:46ch}

  /* --- i sedici --- */
  .strumenti{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 var(--gap)}
  .quanti{display:flex;align-items:center;gap:6px;background:var(--blocco);color:var(--su-blocco);
    border-radius:999px;padding:4px 6px 4px 18px}
  .quanti .etichetta{font:600 14px var(--font-sans);margin-right:4px}
  .quanti button{width:48px;min-height:48px;border:0;border-radius:50%;background:rgba(127,127,127,.26);
    color:var(--su-blocco);font:800 24px/1 var(--font-display)}
  .quanti button:active{background:var(--evidenza);color:var(--blocco)}
  .quanti output{min-width:56px;text-align:center;font:800 26px var(--font-display);
    color:var(--evidenza);font-variant-numeric:tabular-nums}
  .strumenti button{background:transparent;border:2px solid var(--ink);border-radius:999px;
    padding:0 18px;min-height:44px;font:600 14px var(--font-sans)}
  .strumenti button:active{background:var(--ink);color:var(--paper)}

  .elenco{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .giocatore{
    display:flex;align-items:center;gap:12px;background:var(--paper);
    border-radius:18px;padding:10px 12px;min-height:68px;min-width:0;
  }
  .giocatore.assente{background:var(--carta-spenta)}
  .num{
    flex:none;width:38px;height:38px;border-radius:50%;background:var(--blocco);color:var(--su-blocco);
    display:grid;place-items:center;font:800 16px var(--font-display);
  }
  .giocatore.assente .num{background:var(--muted-dark);color:var(--blocco)}
  .nome{
    flex:1 1 auto;min-width:0;width:100%;background:transparent;border:0;outline:0;padding:4px 2px;
    font:800 clamp(19px,2.4vw,26px)/1.15 var(--font-display);color:var(--ink);letter-spacing:-.02em;
    border-bottom:2px dashed transparent;
  }
  .nome:focus{border-bottom-color:var(--ink)}
  .giocatore.assente .nome{color:var(--muted)}
  .stato{flex:none;display:flex;background:var(--scanalatura);border-radius:999px;padding:3px}
  .stato button{
    border:0;background:transparent;border-radius:999px;min-height:40px;padding:0 14px;
    font:600 14px var(--font-sans);color:var(--muted);
  }
  .stato button[aria-pressed="true"]{background:var(--blocco);color:var(--su-blocco)}
  .stato button.bye[aria-pressed="true"]{background:var(--muted);color:var(--su-blocco)}

  /* --- la barra con il pulsantone, sempre a portata di pollice --- */
  body.conCoppie .pagina{padding-bottom:210px}
  .barra{
    position:fixed;left:0;right:0;bottom:0;z-index:5;background:linear-gradient(transparent,var(--bg) 26%);
    padding:24px max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  }
  .barra .dentro{max-width:1100px;margin:0 auto}
  .avvia{
    display:flex;align-items:center;justify-content:center;gap:14px;width:100%;
    min-height:84px;border:0;border-radius:var(--radius);background:var(--azione);color:var(--su-azione);
    font:800 clamp(24px,4.4vw,34px) var(--font-display);letter-spacing:-.02em;
    box-shadow:0 10px 0 var(--ombra-tasto);transition:transform .12s,box-shadow .12s;
  }
  .avvia:active{transform:translateY(6px);box-shadow:0 4px 0 var(--ombra-tasto)}
  .avvia[disabled]{background:var(--tasto-spento);color:var(--muted);box-shadow:none;cursor:not-allowed}
  .avviso{
    margin-top:10px;text-align:center;font:600 15px var(--font-sans);color:var(--rosso);
  }
  .avviso:empty{display:none}

  /* --- il conto alla rovescia --- */
  .sipario{
    position:fixed;inset:0;z-index:20;background:var(--blocco);color:var(--su-blocco);
    display:grid;place-items:center;text-align:center;padding:24px;
  }
  .sipario[hidden]{display:none!important}
  .sipario .scritta{font:600 clamp(18px,4vw,28px) var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--evidenza)}
  .sipario .numero{
    font:800 clamp(140px,44vw,320px)/1 var(--font-display);letter-spacing:-.04em;
    font-variant-numeric:tabular-nums;
  }
  .sipario .numero.battito{animation:battito .9s ease-out}
  @keyframes battito{from{transform:scale(.72);opacity:.2}to{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){.sipario .numero.battito{animation:none}.avvia{transition:none}}

  /* --- il tabellone: una scheda per partita, fatta per essere chiamata
         a voce da chi organizza. Numero grande a sinistra, i due nomi uno
         sotto l'altro, e un tocco per spuntare quella gia' chiamata. --- */
  .comeSiUsa{
    font:600 clamp(15px,2vw,18px) var(--font-sans);color:var(--muted);
    margin:0 4px var(--gap);display:flex;align-items:center;gap:10px;
  }
  .coppie{display:grid;gap:12px}
  .partita{
    display:grid;grid-template-columns:auto 1fr;align-items:center;gap:18px;
    width:100%;text-align:left;background:var(--paper);border:0;border-radius:22px;
    padding:18px 20px;transition:background .15s,opacity .15s;
  }
  .partita .n{
    align-self:stretch;min-width:72px;padding:10px 8px;border-radius:16px;
    background:var(--blocco);color:var(--evidenza);display:grid;place-items:center;gap:2px;
  }
  .partita .n b{font:800 clamp(30px,5vw,44px)/1 var(--font-display);font-variant-numeric:tabular-nums}
  .partita .n span{font:600 10px var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--su-blocco);opacity:.75}
  .chi{min-width:0;display:flex;flex-direction:column;gap:2px}
  .chi .g{
    font:800 clamp(27px,5.2vw,46px)/1.08 var(--font-display);letter-spacing:-.025em;
    overflow-wrap:anywhere;
  }
  .chi .vs{
    font:600 clamp(12px,1.6vw,14px) var(--font-sans);letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);padding:2px 0;
  }
  .partita.conbye{background:var(--carta-spenta)}
  .partita.conbye .n{background:var(--muted)}
  .partita.conbye .n b{color:var(--su-blocco)}
  .chi .g.bye{color:var(--muted)}
  .chi .g small{font:600 .52em/1 var(--font-sans);letter-spacing:.04em;color:var(--muted);white-space:nowrap}
  .passa{
    grid-column:2;font:600 clamp(14px,1.8vw,17px) var(--font-sans);color:var(--muted);
    margin-top:6px;padding-top:10px;border-top:1px solid var(--filo);
  }
  /* spuntata: resta leggibile ma si vede che e' fatta */
  .partita.fatta{background:var(--carta-fatta);opacity:.55}
  .partita.fatta .chi .g{text-decoration:line-through;text-decoration-thickness:3px}
  .partita .fatto{
    grid-column:2;display:none;font:600 14px var(--font-sans);color:var(--muted);
    letter-spacing:.1em;text-transform:uppercase;margin-top:4px;
  }
  .partita.fatta .fatto{display:block}
  .partita.riposa{background:var(--carta-spenta);cursor:default}
  .partita.riposa .n{background:var(--muted)}
  .partita.riposa .n b{color:var(--su-blocco);font-size:22px}

  @media (max-width:420px){
    .stato button{padding:0 11px;font-size:13px}
    .num{width:34px;height:34px;font-size:15px}
  }
  @media (max-width:620px){
    .elenco{grid-template-columns:minmax(0,1fr)}
    .partita{gap:14px;padding:16px}
    .partita .n{min-width:58px}
  }
</style>
</head>
<body>

<div class="pagina">
  <div class="top">
    <a class="back" href="../app.html"><span class="dot" aria-hidden="true">&#8592;</span>App</a>
    <p class="conta" id="conta"></p>
  </div>

  <!-- ===== schermata 1: chi c'è ===== -->
  <section id="vistaElenco">
    <div class="testata">
      <h1>Estrazione Torneo</h1>
      <p>Segna chi c'è e chi è Bye, poi avvia. Il sorteggio accoppia tutti a caso
         per il primo turno ed evita, finché i numeri lo permettono, che due Bye
         si incontrino.</p>
    </div>

    <div class="strumenti">
      <div class="quanti">
        <span class="etichetta" id="etichettaQuanti">Giocatori</span>
        <button type="button" id="meno" aria-label="Un giocatore in meno">&#8722;</button>
        <output id="numeroGiocatori" aria-labelledby="etichettaQuanti">16</output>
        <button type="button" id="piu" aria-label="Un giocatore in piu">+</button>
      </div>
      <button type="button" id="tuttiPresenti">Tutti presenti</button>
      <button type="button" id="nomiDaCapo">Rimetti i nomi</button>
    </div>

    <div class="elenco" id="elenco"></div>
  </section>

  <!-- ===== schermata 2: le coppie ===== -->
  <section id="vistaCoppie" hidden>
    <div class="testata">
      <h1>Primo turno</h1>
      <p id="riassunto"></p>
    </div>
    <div class="coppie" id="coppie"></div>
  </section>
</div>

<div class="barra">
  <div class="dentro">
    <button class="avvia" type="button" id="avvia">Avvia estrazione</button>
    <p class="avviso" id="avviso" role="status"></p>
  </div>
</div>

<div class="sipario" id="sipario" hidden aria-live="assertive" aria-busy="true">
  <div>
    <p class="scritta">Estrazione in corso</p>
    <p class="numero" id="numero">3</p>
  </div>
</div>

<script>
(function(){
  'use strict';

  var PREDEFINITI = 16;        // il numero che si trova gia' scritto
  var MINIMO = 2, MASSIMO = 64;
  var CHIAVE = 'rems:torneo:giocatori';

  /* --------------------------------------------------------- i giocatori - */
  var giocatori = carica();

  function vuoti(n){
    var a = [];
    for(var i = 0; i < n; i++) a.push({ nome: '', bye: false });
    return a;
  }
  function carica(){
    try{
      var g = JSON.parse(localStorage.getItem(CHIAVE));
      if(Array.isArray(g) && g.length >= MINIMO && g.length <= MASSIMO){
        return g.map(function(x){ return { nome: String(x.nome || ''), bye: !!x.bye }; });
      }
    }catch(e){ /* niente memoria: si riparte puliti */ }
    return vuoti(PREDEFINITI);
  }

  /* Cambiare il numero non cancella i nomi gia' scritti: si aggiungono
     caselle vuote in fondo, o si tolgono le ultime. */
  function quantiGiocatori(n){
    n = Math.max(MINIMO, Math.min(MASSIMO, n));
    while(giocatori.length < n) giocatori.push({ nome: '', bye: false });
    if(giocatori.length > n) giocatori.length = n;
    salva(); disegnaElenco();
  }
  function salva(){
    try{ localStorage.setItem(CHIAVE, JSON.stringify(giocatori)); }catch(e){}
  }
  function nomeDi(i){
    return giocatori[i].nome.trim() || ('Giocatore ' + (i + 1));
  }

  /* ------------------------------------------------------------- il caso -
     Fisher-Yates con i numeri casuali del browser: ogni ordine ha la stessa
     probabilita'. Il resto del modulo (% max) darebbe un filo di vantaggio
     ai primi numeri, quindi i valori oltre il limite si buttano.          */
  function sorte(max){
    if(window.crypto && window.crypto.getRandomValues){
      var limite = Math.floor(4294967296 / max) * max;
      var v = new Uint32Array(1), x;
      do{ window.crypto.getRandomValues(v); x = v[0]; }while(x >= limite);
      return x % max;
    }
    return Math.floor(Math.random() * max);
  }
  function mescola(a){
    for(var i = a.length - 1; i > 0; i--){
      var j = sorte(i + 1), t = a[i];
      a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ---------------------------------------------------------- l'estrazione -
     Il bye e' un giocatore come gli altri: entra nel sorteggio e ha il suo
     abbinamento. L'unica regola e' che due bye non si incontrino, e si
     rispetta finche' i numeri lo permettono: prima ogni bye prende un
     presente, poi chi avanza si accoppia fra sé. Se i bye sono piu' dei
     presenti, i bye in eccesso finiscono per forza uno contro l'altro.
     Con un numero dispari di giocatori, l'ultimo estratto riposa.        */
  function estrai(){
    var presenti = [], bye = [];
    for(var i = 0; i < giocatori.length; i++){
      var g = { indice: i, nome: nomeDi(i), bye: giocatori[i].bye };
      (g.bye ? bye : presenti).push(g);
    }
    mescola(presenti); mescola(bye);

    var coppie = [];
    while(bye.length && presenti.length){
      coppie.push({ uno: presenti.pop(), due: bye.pop() });   // il presente a sinistra
    }

    var resto = mescola(presenti.concat(bye));                // o tutti presenti, o tutti bye
    while(resto.length >= 2){
      var x = resto.pop(), y = resto.pop();
      if(sorte(2)){ var t = x; x = y; y = t; }
      coppie.push({ uno: x, due: y });
    }

    mescola(coppie);
    return { coppie: coppie, riposa: resto.length ? resto[0] : null };
  }

  /* Quante partite saranno per forza bye contro bye, con questi numeri. */
  function scontriBye(){
    var b = quantiBye(), p = giocatori.length - b;
    return b > p ? Math.floor((b - p) / 2) : 0;
  }

  /* ------------------------------------------------------ la prima lista - */
  var elenco = document.getElementById('elenco');

  function disegnaElenco(){
    elenco.innerHTML = '';
    giocatori.forEach(function(g, i){
      var riga = document.createElement('div');
      riga.className = 'giocatore' + (g.bye ? ' assente' : '');

      var n = document.createElement('span');
      n.className = 'num'; n.textContent = String(i + 1);

      var nome = document.createElement('input');
      nome.className = 'nome'; nome.type = 'text';
      nome.value = g.nome;
      nome.placeholder = 'Giocatore ' + (i + 1);
      nome.setAttribute('aria-label', 'Nome del giocatore ' + (i + 1));
      nome.setAttribute('autocomplete', 'off');
      nome.addEventListener('input', function(){
        giocatori[i].nome = nome.value; salva(); aggiornaConta();
      });

      var stato = document.createElement('span');
      stato.className = 'stato';
      stato.setAttribute('role', 'group');
      stato.setAttribute('aria-label', 'Stato del giocatore ' + (i + 1));
      stato.appendChild(tasto('Presente', !g.bye, function(){ cambia(i, false); }));
      stato.appendChild(tasto('Bye', g.bye, function(){ cambia(i, true); }, 'bye'));

      riga.appendChild(n); riga.appendChild(nome); riga.appendChild(stato);
      elenco.appendChild(riga);
    });
    aggiornaConta();
  }

  function tasto(testo, acceso, quandoTocchi, classe){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = classe || '';
    b.textContent = testo;
    b.setAttribute('aria-pressed', acceso ? 'true' : 'false');
    b.addEventListener('click', quandoTocchi);
    return b;
  }

  function cambia(i, bye){
    giocatori[i].bye = bye; salva(); disegnaElenco();
  }

  function quantiBye(){
    return giocatori.filter(function(g){ return g.bye; }).length;
  }

  function aggiornaConta(){
    var b = quantiBye(), p = giocatori.length - b;
    document.getElementById('conta').innerHTML =
      '<span><span class="pallino"></span><b>' + p + '</b> presenti</span>' +
      '<span><span class="pallino bye"></span><b>' + b + '</b> bye</span>';
    document.getElementById('numeroGiocatori').textContent = String(giocatori.length);

    // non si blocca niente: si dice solo cosa succedera'
    var s = scontriBye(), avvisi = [];
    if(s) avvisi.push(s === 1
      ? 'I bye sono piu\' dei presenti: una partita sara\' bye contro bye.'
      : 'I bye sono piu\' dei presenti: ' + s + ' partite saranno bye contro bye.');
    if(giocatori.length % 2) avvisi.push('Giocatori dispari: uno riposa.');
    document.getElementById('avviso').textContent = avvisi.join(' ');
  }

  /* -------------------------------------------------- conto alla rovescia - */
  function contoAllaRovescia(quando){
    var sipario = document.getElementById('sipario');
    var numero = document.getElementById('numero');
    var n = 3;

    sipario.hidden = false;
    mostra(n);

    var passo = setInterval(function(){
      n--;
      if(n === 0){
        clearInterval(passo);
        sipario.hidden = true;
        quando();
        return;
      }
      mostra(n);
    }, 1000);

    function mostra(v){
      numero.textContent = String(v);
      numero.classList.remove('battito');
      void numero.offsetWidth;          // riavvia l'animazione
      numero.classList.add('battito');
    }
  }

  /* ----------------------------------------------------- il tabellone ---- */
  function mostraCoppie(esito){
    var coppie = esito.coppie;
    var dove = document.getElementById('coppie');
    dove.innerHTML = '';

    coppie.forEach(function(c, i){
      var conBye = c.uno.bye || c.due.bye;

      // e' un bottone: si tocca per spuntare la partita appena chiamata
      var scheda = document.createElement('button');
      scheda.type = 'button';
      scheda.className = 'partita' + (conBye ? ' conbye' : '');
      scheda.setAttribute('aria-pressed', 'false');

      var n = document.createElement('span');
      n.className = 'n';
      n.innerHTML = '<span>Partita</span><b>' + (i + 1) + '</b>';

      var chi = document.createElement('span');
      chi.className = 'chi';
      chi.appendChild(nomeGrande(c.uno));
      var vs = document.createElement('span');
      vs.className = 'vs'; vs.textContent = 'contro';
      chi.appendChild(vs);
      chi.appendChild(nomeGrande(c.due));

      scheda.appendChild(n);
      scheda.appendChild(chi);

      if(conBye){
        var p = document.createElement('span');
        p.className = 'passa';
        p.textContent = (c.uno.bye && c.due.bye)
          ? 'Due bye: qui non gioca nessuno'
          : (c.uno.bye ? c.due.nome : c.uno.nome) + ' passa il turno';
        scheda.appendChild(p);
      }

      var fatto = document.createElement('span');
      fatto.className = 'fatto';
      fatto.textContent = 'chiamata';
      scheda.appendChild(fatto);

      scheda.addEventListener('click', function(){
        var ora = scheda.classList.toggle('fatta');
        scheda.setAttribute('aria-pressed', ora ? 'true' : 'false');
      });

      dove.appendChild(scheda);
    });

    if(esito.riposa){
      var solo = document.createElement('div');
      solo.className = 'partita riposa';
      solo.innerHTML = '<span class="n"><span>Riposa</span><b>&#9679;</b></span>';
      var chi = document.createElement('span');
      chi.className = 'chi';
      var nome = document.createElement('span');
      nome.className = 'g' + (esito.riposa.bye ? ' bye' : '');
      nome.textContent = esito.riposa.nome + (esito.riposa.bye ? ' (bye)' : '');
      var nota = document.createElement('span');
      nota.className = 'vs'; nota.textContent = 'resta fuori da questo turno';
      chi.appendChild(nome); chi.appendChild(nota);
      solo.appendChild(chi);
      dove.appendChild(solo);
    }

    var conBye2 = coppie.filter(function(c){ return c.uno.bye || c.due.bye; }).length;
    document.getElementById('riassunto').textContent =
      coppie.length + ' partite' + (conBye2 ? ', di cui ' + conBye2 + ' con un bye' : '') +
      '. Chiamale una alla volta: tocca la partita quando l\'hai chiamata.';

    document.getElementById('vistaElenco').hidden = true;
    document.getElementById('vistaCoppie').hidden = false;
    document.body.classList.add('conCoppie');
    window.scrollTo(0, 0);

    var avvia = document.getElementById('avvia');
    avvia.textContent = 'Rifai l\'estrazione';
    mettiTornaIndietro();
  }

  function nomeGrande(g){
    var s = document.createElement('span');
    s.className = 'g' + (g.bye ? ' bye' : '');
    s.textContent = g.nome;
    if(g.bye){
      // si scrive da chi arriva il bye: chi chiama sa sempre di che casella parla
      var tag = document.createElement('small');
      tag.textContent = '(bye)';
      s.appendChild(document.createTextNode(' '));
      s.appendChild(tag);
    }
    return s;
  }

  function mettiTornaIndietro(){
    if(document.getElementById('torna')) return;
    var b = document.createElement('button');
    b.id = 'torna'; b.type = 'button';
    b.textContent = 'Modifica i giocatori';
    b.style.cssText = 'display:block;margin:12px auto 0;background:transparent;border:0;' +
                      'font:600 16px var(--font-sans);color:var(--muted);min-height:44px;' +
                      'text-decoration:underline;text-underline-offset:4px';
    b.addEventListener('click', function(){
      document.getElementById('vistaCoppie').hidden = true;
      document.getElementById('vistaElenco').hidden = false;
      document.body.classList.remove('conCoppie');
      document.getElementById('avvia').textContent = 'Avvia estrazione';
      b.remove();
      window.scrollTo(0, 0);
    });
    document.querySelector('.barra .dentro').appendChild(b);
  }

  /* ------------------------------------------------------------ il via --- */
  document.getElementById('avvia').addEventListener('click', function(){
    var esito = estrai();
    contoAllaRovescia(function(){ mostraCoppie(esito); });
  });

  document.getElementById('meno').addEventListener('click', function(){
    quantiGiocatori(giocatori.length - 1);
  });
  document.getElementById('piu').addEventListener('click', function(){
    quantiGiocatori(giocatori.length + 1);
  });

  document.getElementById('tuttiPresenti').addEventListener('click', function(){
    giocatori.forEach(function(g){ g.bye = false; });
    salva(); disegnaElenco();
  });

  document.getElementById('nomiDaCapo').addEventListener('click', function(){
    giocatori = vuoti(giocatori.length); salva(); disegnaElenco();
  });

  disegnaElenco();
})();
</script>
</body>
</html>
